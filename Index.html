}

/* ---------------------------------------------------------------
   RESULT SCREEN
----------------------------------------------------------------*/
const VERDICT_META = {
  WORTH_IT: { label: "WORTH IT", color: COLORS.grass, soft: COLORS.grassSoft, rotate: -6 },
  WAIT: { label: "WAIT", color: COLORS.honey, soft: COLORS.honeySoft, rotate: 4 },
  SKIP: { label: "SKIP IT", color: COLORS.coral, soft: COLORS.coralSoft, rotate: -4 },
};

function ResultScreen({ profile, goal, purchase, decision, companionMessage, pattern, onDone, onPhoneAFriend, isPremium, phoneAFriendPostsUsed }) {
  const [waitPicked, setWaitPicked] = useState(null);
  const [habitStage, setHabitStage] = useState(pattern ? "prompt" : "none"); // none | prompt | asked | done
  const [habitNote, setHabitNote] = useState("");
  const [habitReply, setHabitReply] = useState("");
  const [habitLoading, setHabitLoading] = useState(false);
  const meta = VERDICT_META[decision.recommendation];

  const finalize = (outcome) => {
    onDone({ purchase, decision, outcome, waitDuration: waitPicked, goal });
  };

  const askCompanion = async (answerLabel) => {
    setHabitStage("asked");
    setHabitLoading(true);
    const sys = buildHabitFollowupPrompt(profile.companion, purchase, pattern, profile);
    const userTurn = habitNote.trim() ? `${answerLabel} — ${habitNote.trim()}` : answerLabel;
    const reply = await callCompanion(sys, userTurn);
    setHabitReply(reply);
    setHabitLoading(false);
    setHabitStage("done");
  };

  const triggerLabel = pattern ? (TRIGGERS.find((t) => t.id === pattern.topTrigger)?.label || pattern.topTrigger).toLowerCase() : "";

  return (
    <Shell>
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 22 }}>
        <div style={{
          background: meta.soft, color: meta.color, border: `2.5px solid ${meta.color}`,
          borderRadius: 14, padding: "10px 28px", fontFamily: "'Fraunces', serif",
          fontWeight: 700, fontSize: 20, letterSpacing: 1, transform: `rotate(${meta.rotate}deg)`,
        }}>
          {meta.label}
        </div>
      </div>

      <div style={{ background: COLORS.periwinkleSoft, borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.periwinkle, textTransform: "uppercase", letterSpacing: 0.5 }}>
            {PERSONALITIES.find((p) => p.id === profile.companion.personality)?.emoji} Your companion
          </div>
          <SpeakButton text={companionMessage} voiceName={profile.voiceName} />
        </div>
        <div style={{ fontSize: 14.5, color: COLORS.ink, lineHeight: 1.55 }}>{companionMessage}</div>
      </div>

      <div style={{ background: COLORS.glass, border: `1.5px dashed ${COLORS.line}`, borderRadius: 14, padding: "16px 18px", marginBottom: 20 }}>
        <div className="tmooi-mono" style={{ fontSize: 12.5, color: COLORS.ink }}>
          <ReceiptRow label={purchase.itemName} value={`$${purchase.price.toFixed(2)}`} bold />
          <ReceiptRow label="Cost per use" value={`$${decision.costPerUse.toFixed(2)}`} />
          {decision.goalImpactPercent != null && goal && (
            <ReceiptRow label={`% of "${goal.name}"`} value={`${decision.goalImpactPercent.toFixed(0)}%`} />
          )}
          <div style={{ borderTop: `1px dashed ${COLORS.line}`, margin: "8px 0" }} />
          {decision.factors.slice(0, 3).map((f, i) => (
            <div key={i} style={{ color: COLORS.inkSoft, fontSize: 11.5, padding: "2px 0" }}>· {f}</div>
          ))}
        </div>
      </div>

      {habitStage === "prompt" && (
        <div style={{ ...cardStyle, marginBottom: 20 }}>
          <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 6 }}>
            Heads up — "{triggerLabel}" has been behind {pattern.topCount} of your last {pattern.recentCount} check-ins.
          </div>
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, lineHeight: 1.5, marginBottom: 12 }}>
            Is this one genuinely different, or does it feel like the same pattern?
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button onClick={() => askCompanion("Yeah, honestly kind of the same pattern")}
              style={{ flex: 1, padding: "10px", borderRadius: 10, border: `1.5px solid ${COLORS.line}`, background: COLORS.glass, color: COLORS.ink, fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
              Kinda the same
            </button>
            <button onClick={() => askCompanion("No, this one's genuinely different")}
              style={{ flex: 1, padding: "10px", borderRadius: 10, border: `1.5px solid ${COLORS.periwinkle}`, background: COLORS.periwinkleSoft, color: COLORS.ink, fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
              No, different
            </button>
          </div>
          <input value={habitNote} onChange={(e) => setHabitNote(e.target.value)} placeholder="Tell them more (optional)" style={{ ...inputStyle, fontSize: 13 }} />
        </div>
      )}

      {(habitStage === "asked" || habitStage === "done") && (
        <div style={{ ...cardStyle, marginBottom: 20 }}>
          {habitLoading ? (
            <div style={{ fontSize: 13, color: COLORS.inkSoft }}>Thinking about that...</div>
          ) : (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
              <div style={{ fontSize: 13.5, color: COLORS.ink, lineHeight: 1.55 }}>{habitReply}</div>
              <SpeakButton text={habitReply} voiceName={profile.voiceName} />
            </div>
          )}
        </div>
      )}

      {decision.recommendation === "WAIT" && !waitPicked && (
        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.ink, marginBottom: 10 }}>Set a wait timer</div>
          <div style={{ display: "flex", gap: 8 }}>
            {["24h", "3d", "7d"].map((d) => (
              <Pill key={d} active={false} onClick={() => setWaitPicked(d)}>{d}</Pill>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {decision.recommendation === "WORTH_IT" && (
          <PrimaryButton onClick={() => finalize("bought")} style={{ background: COLORS.grass }}>
            {ICON.check} Buy it
          </PrimaryButton>
        )}
        {decision.recommendation === "WAIT" && (
          <PrimaryButton onClick={() => finalize("waiting")} disabled={!waitPicked} style={{ background: COLORS.honey }}>
            {ICON.clock} Wait
          </PrimaryButton>
        )}
        {decision.recommendation === "WAIT" && (
          <button
            onClick={() => onPhoneAFriend({ purchase, decision, goal, waitDuration: waitPicked || "3d" })}
            style={{
              padding: "13px", borderRadius: 12, border: `1.5px solid ${COLORS.periwinkle}`,
              background: COLORS.periwinkleSoft, color: COLORS.ink, fontWeight: 700, fontSize: 14.5, cursor: "pointer",
            }}>
            {!isPremium && (phoneAFriendPostsUsed || 0) >= 1
              ? <React.Fragment>📣 Phone a Friend — upgrade to post more</React.Fragment>
              : <React.Fragment>📣 Phone a Friend — let strangers vote</React.Fragment>}
          </button>
        )}
        {decision.recommendation === "SKIP" && (
          <PrimaryButton onClick={() => finalize("skipped")} style={{ background: COLORS.coral }}>
            {ICON.x} Skip it — keep the ${purchase.price.toFixed(0)}
          </PrimaryButton>
        )}
        {/* "Buy it anyway" intentionally omitted on SKIP — a strong no shouldn't offer a talk-back exit */}
        {decision.recommendation !== "SKIP" && (
          <button onClick={() => finalize("bought_anyway")} style={{ background: "none", border: "none", color: COLORS.inkSoft, fontSize: 13, padding: "8px", cursor: "pointer" }}>
            Buy it anyway
          </button>
        )}
      </div>
    </Shell>
  );
}

function ReceiptRow({ label, value, bold }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "3px 0", fontWeight: bold ? 700 : 400 }}>
      <span>{label}</span>
      <span>{value}</span>
    </div>
  );
}

/* ---------------------------------------------------------------
   PHONE A FRIEND — compose & public feed
----------------------------------------------------------------*/
function PhoneAFriendCompose({ itemName, price, onPost, onSkip, posting }) {
  const [photoDataUrl, setPhotoDataUrl] = useState(null);
  const [comment, setComment] = useState("");
  const [resizing, setResizing] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setResizing(true);
    try { setPhotoDataUrl(await resizeImageToDataUrl(file)); }
    catch (err) { console.error("photo resize failed:", err); }
    setResizing(false);
  };

  return (
    <Shell>
      <FlowHeader title="Phone a Friend" onCancel={onSkip} />
      <div style={{ fontSize: 13.5, color: COLORS.inkSoft, lineHeight: 1.5, marginBottom: 18 }}>
        Post <span style={{ color: COLORS.ink, fontWeight: 700 }}>{itemName}</span> (<span className="tmooi-mono">${price}</span>) to the public feed, anonymously.
        People vote Hit or Skip — nobody sees who posted it.
      </div>

      <label style={{
        display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
        height: photoDataUrl ? "auto" : 180, borderRadius: 16, border: `1.5px dashed ${COLORS.line}`,
        background: COLORS.glass, cursor: "pointer", overflow: "hidden", marginBottom: 14,
      }}>
        <input type="file" accept="image/*" capture="environment" onChange={handleFile} style={{ display: "none" }} />
        {photoDataUrl ? (
          <img src={photoDataUrl} alt="" style={{ width: "100%", maxHeight: 320, objectFit: "cover", display: "block" }} />
        ) : (
          <div style={{ textAlign: "center", color: COLORS.inkSoft, fontSize: 13.5 }}>
            {resizing ? "Processing photo..." : (<React.Fragment>📸 Add a photo<div style={{ fontSize: 11.5, marginTop: 4 }}>Tap to take or choose one</div></React.Fragment>)}
          </div>
        )}
      </label>

      <textarea value={comment} onChange={(e) => setComment(e.target.value)} placeholder="Add a comment — what's making you unsure?"
        rows={3} style={{ ...inputStyle, resize: "none", marginBottom: 18 }} />

      <PrimaryButton onClick={() => onPost(photoDataUrl, comment.trim())} disabled={!photoDataUrl || posting} style={{ background: COLORS.periwinkle }}>
        {posting ? "Posting..." : <React.Fragment>📣 Post it</React.Fragment>}
      </PrimaryButton>
      <button onClick={onSkip} style={{ width: "100%", marginTop: 10, background: "none", border: "none", color: COLORS.inkSoft, fontSize: 13, padding: "8px", cursor: "pointer" }}>
        Never mind, just wait
      </button>
    </Shell>
  );
}

function PublicFeed({ uid, onBack }) {
  const [posts, setPosts] = useState(null); // null = loading
  const [voting, setVoting] = useState(null);

  const load = async () => setPosts(await fetchFeedPostsToVote(uid));
  useEffect(() => { load(); }, []);

  const vote = async (postId, choice) => {
    setVoting(postId);
    await castFeedVote(postId, uid, choice);
    setPosts((prev) => prev.filter((p) => p.id !== postId));
    setVoting(null);
  };

  return (
    <Shell>
      <FlowHeader title="📣 Phone a Friend feed" onCancel={onBack} />
      {posts === null && <div style={{ textAlign: "center", color: COLORS.inkSoft, paddingTop: 60 }}>Loading...</div>}
      {posts !== null && posts.length === 0 && (
        <div style={{ textAlign: "center", color: COLORS.inkSoft, paddingTop: 60, fontSize: 13.5 }}>
          Nothing waiting for a vote right now — check back later.
        </div>
      )}
      {posts && posts.map((p) => (
        <div key={p.id} style={{ ...cardStyle, marginBottom: 16, overflow: "hidden", padding: 0 }}>
          {p.photoDataUrl && <img src={p.photoDataUrl} alt="" style={{ width: "100%", maxHeight: 260, objectFit: "cover", display: "block" }} />}
          <div style={{ padding: "14px 16px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
              <div style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink }}>{p.itemName}</div>
              <div className="tmooi-mono" style={{ fontSize: 14, fontWeight: 700, color: COLORS.ink }}>${p.price}</div>
            </div>
            {p.comment && <div style={{ fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.45, marginBottom: 12 }}>{p.comment}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => vote(p.id, "hit")} disabled={voting === p.id}
                style={{ flex: 1, padding: "11px", borderRadius: 10, border: `1.5px solid ${COLORS.grass}`, background: COLORS.grassSoft, color: COLORS.ink, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>
                {ICON.check} Hit it
              </button>
              <button onClick={() => vote(p.id, "skip")} disabled={voting === p.id}
                style={{ flex: 1, padding: "11px", borderRadius: 10, border: `1.5px solid ${COLORS.coral}`, background: COLORS.coralSoft, color: COLORS.ink, fontWeight: 700, fontSize: 13.5, cursor: "pointer" }}>
                {ICON.x} Skip it
              </button>
            </div>
          </div>
        </div>
      ))}
    </Shell>
  );
}

/* ---------------------------------------------------------------
   CELEBRATION SCREEN — shown after a Skip
----------------------------------------------------------------*/
const CATCHUP_IDEAS = [
  { id: "next_contribution", label: "Add it to my next contribution", detail: "Tack the amount onto your next deposit toward this goal." },
  { id: "trim_elsewhere", label: "Trim something else this week", detail: "Skip one non-essential purchase this week to offset it." },
  { id: "push_date", label: "Push the target date out a bit", detail: "Give the goal a little more runway instead of catching up all at once." },
  { id: "someone_else", label: "Someone else on this goal covers it", detail: "Ask a co-contributor to pick up the difference this round." },
  { id: "own_way", label: "I've got another way to cover it", detail: "" },
];

function CelebrationScreen({ mode = "saved", goal, amount, impactPercent, onSaveCatchUpPlan, onContinue }) {
  const [accStep, setAccStep] = useState("prompt"); // prompt | ideas | done | skipped
  const [pickedIdea, setPickedIdea] = useState(null);
  const [planNote, setPlanNote] = useState("");

  const confettiPieces = mode === "bought" ? ["👀", "🤝", "✨", "💫", "⭐"] : (mode === "group_complete" || mode === "personal_goal_met") ? ["🎉", "🥳", "✨", "💫", "🎊"] : ["✨", "🥂", "⭐", "🎊", "💫"];
  const copy = mode === "bought"
    ? {
        icon: "👀",
        title: "Okay, I see you.",
        body: (
          <React.Fragment>
            You sat with it, waited it out, and you're still sure. That's not impulse —
            that's a <span className="tmooi-mono" style={{ color: COLORS.ink, fontWeight: 700 }}>${amount.toFixed(0)}</span> decision you actually made.
          </React.Fragment>
        ),
        goalLine: null,
        button: <React.Fragment>Go get it {ICON.sparkles}</React.Fragment>,
      }
    : mode === "group_complete"
    ? {
        icon: "🎉",
        title: "Congratulations!",
        body: (
          <React.Fragment>
            You and everyone chipping in just finished saving{" "}
            <span className="tmooi-mono" style={{ color: COLORS.ink, fontWeight: 700 }}>${amount.toFixed(0)}</span> for{" "}
            <span style={{ color: COLORS.ink, fontWeight: 700 }}>{goal?.name}</span>. You did it!
          </React.Fragment>
        ),
        goalLine: <React.Fragment>Enjoy it 🎊</React.Fragment>,
        button: <React.Fragment>Nice {ICON.sparkles}</React.Fragment>,
      }
    : mode === "personal_goal_met"
    ? {
        icon: "🏆",
        title: "Congratulations!",
        body: (
          <React.Fragment>
            You just hit <span className="tmooi-mono" style={{ color: COLORS.ink, fontWeight: 700 }}>${amount.toFixed(0)}</span> for{" "}
            <span style={{ color: COLORS.ink, fontWeight: 700 }}>{goal?.name}</span>. You did it!
          </React.Fragment>
        ),
        goalLine: <React.Fragment>Enjoy it 🎊</React.Fragment>,
        button: <React.Fragment>Nice {ICON.sparkles}</React.Fragment>,
      }
    : {
        icon: "🎉",
        title: "You did it!",
        body: (
          <React.Fragment>
            You just kept <span className="tmooi-mono" style={{ color: COLORS.ink, fontWeight: 700 }}>${amount.toFixed(0)}</span> in your pocket.
          </React.Fragment>
        ),
        goalLine: goal ? <React.Fragment>One step closer to {goal.name} 🎯</React.Fragment> : null,
        button: <React.Fragment>Nice {ICON.sparkles}</React.Fragment>,
      };

  const showAccommodation = mode === "bought" && !!goal;

  const savePlan = () => {
    const idea = CATCHUP_IDEAS.find((i) => i.id === pickedIdea);
    const text = planNote.trim() || idea?.detail || idea?.label || "";
    if (goal && onSaveCatchUpPlan) onSaveCatchUpPlan(goal.id, text);
    setAccStep("done");
  };

  return (
    <Shell>
      <div style={{ position: "relative", textAlign: "center", paddingTop: 70, overflow: "hidden" }}>
        {Array.from({ length: 12 }).map((_, i) => (
          <span key={i} style={{
            position: "absolute", left: `${(i * 37) % 100}%`, top: -20, fontSize: 18,
            animation: `confettiFall ${1.6 + (i % 4) * 0.3}s ease-in ${i * 0.08}s forwards`,
          }}>
            {confettiPieces[i % confettiPieces.length]}
          </span>
        ))}
        <div style={{ fontSize: 46, marginBottom: 16 }}>{copy.icon}</div>
        <h1 className="tmooi-display" style={{ fontSize: 28, fontWeight: 700, color: COLORS.ink, marginBottom: 10 }}>
          {copy.title}
        </h1>
        <p style={{ color: COLORS.inkSoft, fontSize: 15, lineHeight: 1.5, marginBottom: 6 }}>
          {copy.body}
        </p>
        {copy.goalLine && (
          <p style={{ color: COLORS.periwinkle, fontSize: 15, fontWeight: 600, marginBottom: 36 }}>
            {copy.goalLine}
          </p>
        )}
        {!copy.goalLine && !showAccommodation && <div style={{ marginBottom: 36 }} />}

        {showAccommodation && accStep === "prompt" && (
          <div style={{ ...cardStyle, textAlign: "left", marginBottom: 20 }}>
            <div style={{ fontSize: 14.5, fontWeight: 600, color: COLORS.ink, marginBottom: 6 }}>
              Want to make up the difference for "{goal.name}"?
            </div>
            <div style={{ fontSize: 13, color: COLORS.inkSoft, lineHeight: 1.5, marginBottom: 14 }}>
              {impactPercent != null ? `This took about ${impactPercent.toFixed(0)}% out of that goal. ` : ""}
              No pressure — a quick plan now just keeps you on track to still hit it.
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setAccStep("ideas")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: COLORS.goldGrad, color: COLORS.onGold, fontWeight: 700, fontSize: 13, cursor: "pointer" }}>
                Yes, help me plan
              </button>
              <button onClick={() => setAccStep("skipped")} style={{ flex: 1, padding: "10px", borderRadius: 10, border: `1.5px solid ${COLORS.line}`, background: "none", color: COLORS.inkSoft, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>
                I'm good
              </button>
            </div>
          </div>
        )}

        {showAccommodation && accStep === "ideas" && (
          <div style={{ ...cardStyle, textAlign: "left", marginBottom: 20 }}>
            <div style={{ fontSize: 14.5, fontWeight: 600, color: COLORS.ink, marginBottom: 12 }}>Which way works better for you?</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
              {CATCHUP_IDEAS.map((idea) => (
                <button key={idea.id} onClick={() => setPickedIdea(idea.id)}
                  style={{ textAlign: "left", padding: "12px 14px", borderRadius: 12, border: `1.5px solid ${pickedIdea === idea.id ? COLORS.periwinkle : COLORS.line}`, background: pickedIdea === idea.id ? COLORS.periwinkleSoft : COLORS.glass, cursor: "pointer" }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{idea.label}</div>
                  {idea.detail && <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 3 }}>{idea.detail}</div>}
                </button>
              ))}
            </div>
            <input value={planNote} onChange={(e) => setPlanNote(e.target.value)} placeholder="Or write your own plan (optional)" style={{ ...inputStyle, marginBottom: 12, fontSize: 13.5 }} />
            <button onClick={savePlan} disabled={!pickedIdea && !planNote.trim()}
              style={{ width: "100%", padding: "12px", borderRadius: 10, border: "none",
                background: (!pickedIdea && !planNote.trim()) ? "rgba(255,255,255,0.06)" : COLORS.goldGrad,
                color: (!pickedIdea && !planNote.trim()) ? COLORS.inkSoft : COLORS.onGold,
                fontWeight: 700, fontSize: 13, cursor: (!pickedIdea && !planNote.trim()) ? "not-allowed" : "pointer" }}>
              Save the plan
            </button>
          </div>
        )}

        {showAccommodation && accStep === "done" && (
          <div style={{ ...cardStyle, textAlign: "left", marginBottom: 20, background: COLORS.grassSoft, border: "none" }}>
            <div style={{ fontSize: 13.5, color: COLORS.ink, lineHeight: 1.5 }}>{ICON.check} Plan saved — you'll see it on "{goal.name}" going forward.</div>
          </div>
        )}

        {showAccommodation && accStep === "skipped" && <div style={{ marginBottom: 20 }} />}

        <PrimaryButton onClick={onContinue} style={{ background: COLORS.periwinkle }}>
          {copy.button}
        </PrimaryButton>
      </div>
    </Shell>
  );
}

/* ---------------------------------------------------------------
   CREATE GROUP GOAL — multi-step wizard
----------------------------------------------------------------*/
function CreateGroupGoal({ profile, uid, onCreate, onCancel }) {
  const [step, setStep] = useState(0);
  const [type, setType] = useState(null);
  const [name, setName] = useState("");
  const [whatFor, setWhatFor] = useState("");
  const [targetAmount, setTargetAmount] = useState("");
  const [targetDate, setTargetDate] = useState("");
  const [participantNames, setParticipantNames] = useState([]);
  const [nameInput, setNameInput] = useState("");
  const [frequency, setFrequency] = useState(null);
  const [customDays, setCustomDays] = useState("");
  const [myReminderDay, setMyReminderDay] = useState(null);
  const [contributionType, setContributionType] = useState(null);
  const [customAmounts, setCustomAmounts] = useState({});

  const steps = ["type", "details", "people", "frequency", "reminderDay", "split", "review"];
  const cur = steps[step];
  const next = () => setStep((s) => Math.min(s + 1, steps.length - 1));
  const back = () => setStep((s) => Math.max(s - 1, 0));

  const allParticipants = ["You", ...participantNames];
  const intervalDays = frequency === "custom" ? (parseInt(customDays) || 30) : FREQUENCIES.find((f) => f.id === frequency)?.days;

  const addName = () => {
    if (nameInput.trim()) { setParticipantNames([...participantNames, nameInput.trim()]); setNameInput(""); }
  };
  const removeName = (i) => setParticipantNames(participantNames.filter((_, idx) => idx !== i));

  const equalAmount = allParticipants.length ? Math.round((parseFloat(targetAmount) / allParticipants.length) * 100) / 100 : 0;

  const create = () => {
    const target = parseFloat(targetAmount) || 0;
    const participants = allParticipants.map((pname, i) => {
      const allocated = contributionType === "custom"
        ? (parseFloat(customAmounts[i]) || 0)
        : equalAmount;
      return {
        id: `participant-${i}`,
        name: pname,
        uid: i === 0 ? uid : null, // everyone but the creator starts as an unclaimed name slot until they accept the invite
        allocatedAmount: allocated,
        schedule: generateSchedule(allocated, targetDate, intervalDays),
        reminderDay: i === 0 ? myReminderDay : null,
      };
    });
    onCreate({
      id: `group-${Date.now()}`,
      type, name, whatFor,
      targetAmount: target,
      targetDate,
      frequency, intervalDays,
      contributionType,
      participants,
      ownerUid: uid,
      memberUids: [uid],
      inviteCode: randomInviteCode(),
      ownerParticipantId: participants[0].id, // creator — only they can dismiss the "goal met" card for everyone
      currentAmount: 0,
      celebrated: false,
      archived: false,
      createdAt: Date.now(),
    });
  };

  return (
    <Shell>
      <FlowHeader title="New group goal" onCancel={onCancel} />
      <ProgressDots step={step} total={steps.length} />

      {cur === "type" && (
        <div>
          <h3 style={qTitle}>What are you saving for?</h3>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {GROUP_TYPES.map((t) => (
              <button key={t.id} onClick={() => setType(t.id)}
                style={{ padding: "16px 12px", borderRadius: 14, textAlign: "left", border: `1.5px solid ${type === t.id ? COLORS.periwinkle : COLORS.line}`, background: type === t.id ? COLORS.periwinkleSoft : COLORS.glass, cursor: "pointer" }}>
                <div style={{ fontSize: 22, marginBottom: 6 }}>{t.emoji}</div>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{t.label}</div>
              </button>
            ))}
          </div>
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={next} disabled={!type}>Continue {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}

      {cur === "details" && (
        <div>
          <h3 style={qTitle}>Give it a name and a target</h3>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Miami Girls Trip" style={inputStyle} />
          <input value={whatFor} onChange={(e) => setWhatFor(e.target.value)} placeholder="What we're saving for (optional)" style={{ ...inputStyle, marginTop: 10 }} />
          <input value={targetAmount} onChange={(e) => setTargetAmount(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="Total goal amount ($)" inputMode="decimal" style={{ ...inputStyle, marginTop: 10 }} />
          <input type="date" value={targetDate} onChange={(e) => setTargetDate(e.target.value)} style={{ ...inputStyle, marginTop: 10 }} />
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={next} disabled={!name.trim() || !targetAmount || !targetDate}>Continue {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}

      {cur === "people" && (
        <div>
          <h3 style={qTitle}>Who's in?</h3>
          <p style={{ color: COLORS.inkSoft, fontSize: 13.5, marginBottom: 14 }}>You're automatically included. Add everyone else — you can invite them after creating the goal.</p>
          <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
            <input value={nameInput} onChange={(e) => setNameInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addName()} placeholder="Participant name" style={{ ...inputStyle, flex: 1 }} />
            <button onClick={addName} style={{ padding: "0 18px", borderRadius: 12, border: "none", background: COLORS.goldGrad, color: COLORS.onGold, fontWeight: 600, cursor: "pointer" }}>Add</button>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 14px", background: COLORS.periwinkleSoft, borderRadius: 10, fontSize: 14, fontWeight: 600, color: COLORS.ink }}>You (that's you!)</div>
            {participantNames.map((pn, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 14px", background: COLORS.glass, border: `1px solid ${COLORS.line}`, borderRadius: 10 }}>
                <span style={{ fontSize: 14, color: COLORS.ink }}>{pn}</span>
                <button onClick={() => removeName(i)} style={{ background: "none", border: "none", color: COLORS.inkSoft, cursor: "pointer" }}>{ICON.x}</button>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={next} disabled={participantNames.length === 0}>Continue with {allParticipants.length} people {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}

      {cur === "frequency" && (
        <div>
          <h3 style={qTitle}>How often should the group save?</h3>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {FREQUENCIES.map((f) => (
              <button key={f.id} onClick={() => setFrequency(f.id)} style={{ padding: "14px 16px", borderRadius: 12, border: `1.5px solid ${frequency === f.id ? COLORS.periwinkle : COLORS.line}`, background: frequency === f.id ? COLORS.periwinkleSoft : COLORS.glass, textAlign: "left", fontSize: 14.5, fontWeight: 500, color: COLORS.ink, cursor: "pointer" }}>
                {f.label}
              </button>
            ))}
          </div>
          {frequency === "custom" && (
            <input value={customDays} onChange={(e) => setCustomDays(e.target.value.replace(/[^0-9]/g, ""))} placeholder="Every how many days?" style={{ ...inputStyle, marginTop: 10 }} />
          )}
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={next} disabled={!frequency || (frequency === "custom" && !customDays)}>Continue {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}

      {cur === "reminderDay" && (
        <div>
          <h3 style={qTitle}>When should we remind you?</h3>
          <p style={{ color: COLORS.inkSoft, fontSize: 13.5, marginBottom: 18 }}>Everyone you invite picks their own day when they join — this one's just for you.</p>
          <ReminderDayPicker frequency={frequency} value={myReminderDay} onChange={setMyReminderDay} />
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={next} disabled={!myReminderDay}>Continue {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}

      {cur === "split" && (
        <div>
          <h3 style={qTitle}>How should the goal be split?</h3>
          <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
            <Pill active={contributionType === "equal"} onClick={() => setContributionType("equal")}>Equal split</Pill>
            <Pill active={contributionType === "custom"} onClick={() => setContributionType("custom")}>Custom amounts</Pill>
          </div>
          {contributionType === "equal" && (
            <div style={{ ...cardStyle }}>
              {allParticipants.map((p, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0" }}>
                  <span style={{ fontSize: 14, color: COLORS.ink }}>{p}</span>
                  <span className="tmooi-mono" style={{ fontSize: 14, color: COLORS.ink }}>${equalAmount}</span>
                </div>
              ))}
            </div>
          )}
          {contributionType === "custom" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {allParticipants.map((p, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 14, color: COLORS.ink, flex: 1 }}>{p}</span>
                  <input value={customAmounts[i] || ""} onChange={(e) => setCustomAmounts({ ...customAmounts, [i]: e.target.value.replace(/[^0-9.]/g, "") })} placeholder="$" inputMode="decimal" style={{ ...inputStyle, width: 100 }} />
                </div>
              ))}
              <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 4 }}>
                Assigned so far: ${Object.values(customAmounts).reduce((s, v) => s + (parseFloat(v) || 0), 0)} of ${targetAmount || 0}
              </div>
            </div>
          )}
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={next} disabled={!contributionType}>Continue {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}

      {cur === "review" && (
        <div>
          <h3 style={qTitle}>{GROUP_TYPES.find(t => t.id === type)?.emoji} {name}</h3>
          <div style={cardStyle}>
            <ReceiptRow label="Goal" value={`$${targetAmount}`} bold />
            <ReceiptRow label="Target date" value={targetDate} />
            <ReceiptRow label="People" value={`${allParticipants.length}`} />
            <ReceiptRow label="Frequency" value={FREQUENCIES.find(f => f.id === frequency)?.label} />
            <div style={{ borderTop: `1px dashed ${COLORS.line}`, margin: "8px 0" }} />
            {allParticipants.map((p, i) => (
              <ReceiptRow key={i} label={p} value={`$${contributionType === "custom" ? (customAmounts[i] || 0) : equalAmount}`} />
            ))}
          </div>
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={create} style={{ background: COLORS.honey }}>Create group goal {ICON.sparkles}</PrimaryButton></div>
        </div>
      )}

      {step > 0 && (
        <button onClick={back} style={{ marginTop: 18, background: "none", border: "none", color: COLORS.inkSoft, fontSize: 13, display: "flex", alignItems: "center", gap: 4, cursor: "pointer" }}>
          {ICON.arrowLeft} Back
        </button>
      )}
    </Shell>
  );
}

const WEEKDAY_LABELS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

// Lets someone pick which day they personally want contribution reminders
// on — a day of the week for weekly/biweekly goals, a day of the month for
// monthly ones. Stored per-participant so different members of the same
// group goal can each get reminded on the day that works for them.
function ReminderDayPicker({ frequency, value, onChange }) {
  const isMonthly = frequency === "monthly";
  return (
    <div>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, marginBottom: 8 }}>
        {isMonthly ? "Which day of the month should we remind you?" : "Which day should we remind you?"}
      </div>
      {isMonthly ? (
        <input value={value?.value || ""} onChange={(e) => onChange({ type: "monthly", value: Math.min(28, Math.max(1, parseInt(e.target.value.replace(/[^0-9]/g, "")) || 1)) })}
          placeholder="Day of month (1-28)" inputMode="numeric" style={inputStyle} />
      ) : (
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {WEEKDAY_LABELS.map((d, i) => (
            <button key={i} onClick={() => onChange({ type: "weekly", value: i })}
              style={{
                padding: "8px 12px", borderRadius: 10, border: `1.5px solid ${value?.value === i ? COLORS.periwinkle : COLORS.line}`,
                background: value?.value === i ? COLORS.periwinkleSoft : COLORS.glass, color: COLORS.ink, fontSize: 13, fontWeight: 600, cursor: "pointer",
              }}>{d}</button>
          ))}
        </div>
      )}
    </div>
  );
}

function JoinGroupGoal({ inviteCode, uid, onJoined, onSkip }) {
  const [status, setStatus] = useState("loading"); // loading | found | notfound | joining
  const [groupGoal, setGroupGoal] = useState(null);
  const [claimId, setClaimId] = useState(null); // participant id being claimed, or "new"
  const [newName, setNewName] = useState("");
  const [reminderDay, setReminderDay] = useState(null);

  useEffect(() => {
    (async () => {
      const g = await findGroupGoalByInviteCode(inviteCode);
      if (!g) { setStatus("notfound"); return; }
      if ((g.memberUids || []).includes(uid)) { onJoined(g); return; } // already in it
      setGroupGoal(g);
      setStatus("found");
    })();
  }, [inviteCode]);

  const unclaimed = (groupGoal?.participants || []).filter((p) => !p.uid);

  const confirm = async () => {
    setStatus("joining");
    const result = await joinGroupGoal(groupGoal.id, uid, {
      claimParticipantId: claimId && claimId !== "new" ? claimId : null,
      newName: claimId === "new" ? newName.trim() : null,
      reminderDay,
    });
    if (result) onJoined(result);
    else setStatus("found");
  };

  if (status === "loading") {
    return <Shell><div style={{ textAlign: "center", paddingTop: 120, color: COLORS.inkSoft }}>Loading invite...</div></Shell>;
  }
  if (status === "notfound") {
    return (
      <Shell>
        <div style={{ textAlign: "center", paddingTop: 100 }}>
          <div style={{ fontSize: 36, marginBottom: 12 }}>🤷</div>
          <h2 className="tmooi-display" style={{ fontSize: 20, fontWeight: 700, color: COLORS.ink, marginBottom: 8 }}>That invite link isn't valid</h2>
          <p style={{ color: COLORS.inkSoft, fontSize: 13.5, marginBottom: 22 }}>It may have expired, or been typed wrong.</p>
          <PrimaryButton onClick={onSkip}>Go to my dashboard {ICON.arrowRight}</PrimaryButton>
        </div>
      </Shell>
    );
  }

  const canConfirm = claimId && (claimId !== "new" || newName.trim()) && reminderDay;

  return (
    <Shell>
      <FlowHeader title="Join group goal" onCancel={onSkip} />
      <div style={cardStyle}>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 4 }}>You've been invited to</div>
        <div className="tmooi-display" style={{ fontSize: 20, fontWeight: 700, color: COLORS.ink, marginBottom: 6 }}>
          {GROUP_TYPES.find((t) => t.id === groupGoal.type)?.emoji} {groupGoal.name}
        </div>
        <div style={{ fontSize: 13, color: COLORS.inkSoft }}>${groupGoal.targetAmount} goal · {groupGoal.participants.length} people so far</div>
      </div>

      <div style={{ marginTop: 20, marginBottom: 8, fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>Which one is you?</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {unclaimed.map((p) => (
          <button key={p.id} onClick={() => setClaimId(p.id)}
            style={{ padding: "12px 16px", borderRadius: 12, textAlign: "left", border: `1.5px solid ${claimId === p.id ? COLORS.periwinkle : COLORS.line}`, background: claimId === p.id ? COLORS.periwinkleSoft : COLORS.glass, fontSize: 14, fontWeight: 600, color: COLORS.ink, cursor: "pointer" }}>
            {p.name}
          </button>
        ))}
        <button onClick={() => setClaimId("new")}
          style={{ padding: "12px 16px", borderRadius: 12, textAlign: "left", border: `1.5px solid ${claimId === "new" ? COLORS.periwinkle : COLORS.line}`, background: claimId === "new" ? COLORS.periwinkleSoft : COLORS.glass, fontSize: 14, fontWeight: 600, color: COLORS.ink, cursor: "pointer" }}>
          None of these — add me
        </button>
        {claimId === "new" && (
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Your name" style={inputStyle} />
        )}
      </div>

      <div style={{ marginTop: 20 }}>
        <ReminderDayPicker frequency={groupGoal.frequency} value={reminderDay} onChange={setReminderDay} />
      </div>

      <div style={{ marginTop: 24 }}>
        <PrimaryButton onClick={confirm} disabled={!canConfirm || status === "joining"}>
          {status === "joining" ? "Joining..." : <React.Fragment>Join {groupGoal.name} {ICON.arrowRight}</React.Fragment>}
        </PrimaryButton>
      </div>
    </Shell>
  );
}

/* ---------------------------------------------------------------
   GROUP GOAL DETAIL — shared dashboard + your contribution tracker
----------------------------------------------------------------*/
function GroupGoalDetail({ groupGoal, uid, onBack, onToggleContribution }) {
  const [copied, setCopied] = useState(false);
  const [recipientEmail, setRecipientEmail] = useState("");
  const [emailsSent, setEmailsSent] = useState([]);
  const gp = Math.min(100, Math.round((groupGoal.currentAmount / groupGoal.targetAmount) * 100));
  const totalInstallments = groupGoal.participants.reduce((s, p) => s + p.schedule.length, 0);
  const completedInstallments = groupGoal.participants.reduce((s, p) => s + p.schedule.filter((c) => c.completed).length, 0);
  const inviteLink = `${window.location.origin}${window.location.pathname}?invite=${groupGoal.inviteCode}`;

  const copyLink = () => {
    try { navigator.clipboard.writeText(inviteLink); } catch {}
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  };

  const emailSubject = `Join me on "${groupGoal.name}"`;
  const emailBody = `I'm saving up for ${groupGoal.whatFor || groupGoal.name} and want you in on it. Join here: ${inviteLink}`;
  const mailtoHref = `mailto:${encodeURIComponent(recipientEmail.trim())}?subject=${encodeURIComponent(emailSubject)}&body=${encodeURIComponent(emailBody)}`;

  const trackEmailSent = () => {
    if (recipientEmail.trim()) setEmailsSent([recipientEmail.trim(), ...emailsSent]);
  };

  return (
    <Shell>
      <FlowHeader title={`${GROUP_TYPES.find(t => t.id === groupGoal.type)?.emoji} ${groupGoal.name}`} onCancel={onBack} />

      <div style={cardStyle}>
        <div className="tmooi-mono" style={{ fontSize: 24, fontWeight: 700, color: COLORS.ink, marginBottom: 8 }}>
          ${groupGoal.currentAmount} <span style={{ color: COLORS.inkSoft, fontWeight: 400, fontSize: 16 }}>/ ${groupGoal.targetAmount}</span>
        </div>
        <div style={{ height: 9, borderRadius: 9, background: COLORS.line, overflow: "hidden" }}>
          <div style={{ height: "100%", width: `${gp}%`, background: COLORS.honey, borderRadius: 9 }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 12, color: COLORS.inkSoft }}>
          <span>{gp}% complete</span>
          <span>${groupGoal.targetAmount - groupGoal.currentAmount} remaining</span>
        </div>
        <div style={{ marginTop: 10, display: "inline-flex", alignItems: "center", gap: 6, fontSize: 11.5, fontWeight: 600, color: COLORS.periwinkle, background: COLORS.periwinkleSoft, padding: "5px 10px", borderRadius: 999 }}>
          {ICON.clock} Contributing {(FREQUENCIES.find((f) => f.id === groupGoal.frequency)?.label || "regularly").toLowerCase()}
        </div>
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
        <div style={{ ...cardStyle, flex: 1, textAlign: "center", padding: "12px" }}>
          <div className="tmooi-mono" style={{ fontSize: 18, fontWeight: 700, color: COLORS.ink }}>{groupGoal.participants.length}</div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft }}>participants</div>
        </div>
        <div style={{ ...cardStyle, flex: 1, textAlign: "center", padding: "12px" }}>
          <div className="tmooi-mono" style={{ fontSize: 18, fontWeight: 700, color: COLORS.ink }}>{completedInstallments} / {totalInstallments}</div>
          <div style={{ fontSize: 11, color: COLORS.inkSoft }}>contributions</div>
        </div>
      </div>

      {/* Contributions — every contributor's name and progress shows to the whole group, but each person only logs their own */}
      <div style={{ ...cardStyle, marginTop: 14 }}>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 4 }}>Contributions</div>
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 14, lineHeight: 1.4 }}>
          You log your own payments below — everyone in the group can see everyone's progress.
        </div>
        {groupGoal.participants.map((p, pi) => {
          const done = p.schedule.filter((c) => c.completed).reduce((s, c) => s + c.amount, 0);
          const ppct = p.allocatedAmount ? Math.min(100, Math.round((done / p.allocatedAmount) * 100)) : 0;
          return (
            <div key={p.id} style={{ padding: "12px 0", borderTop: pi === 0 ? "none" : `1px solid ${COLORS.line}` }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13.5, marginBottom: 6 }}>
                <span style={{ fontWeight: 700, color: COLORS.ink }}>{p.name}{p.uid === uid ? " (you)" : !p.uid ? " · invited" : ""}</span>
                <span className="tmooi-mono" style={{ color: COLORS.inkSoft }}>${done} / ${p.allocatedAmount}</span>
              </div>
              <div style={{ height: 6, borderRadius: 6, background: COLORS.line, overflow: "hidden", marginBottom: 10 }}>
                <div style={{ height: "100%", width: `${ppct}%`, background: p.uid === uid ? COLORS.periwinkle : COLORS.honey, borderRadius: 6 }} />
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                {p.schedule.map((c, i) => (
                  p.uid === uid ? (
                    <button key={i} onClick={() => onToggleContribution(p.id, i)}
                      style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 12px", borderRadius: 10, border: `1px solid ${COLORS.line}`, background: c.completed ? COLORS.grassSoft : COLORS.glass, cursor: "pointer", textAlign: "left" }}>
                      <span style={{ fontSize: 13, color: COLORS.ink }}>{formatDueDate(c.dueDate)} — ${c.amount}</span>
                      <span style={{ fontSize: 12, fontWeight: 600, color: c.completed ? COLORS.grass : COLORS.inkSoft }}>
                        {c.completed ? `${ICON.check} Logged` : "○ Log it"}
                      </span>
                    </button>
                  ) : (

      {/* Invite */}

        <div style={{ fontSize: 11, color: COLORS.inkSoft, marginBottom: 10, lineHeight: 1.4 }}>

        {emailsSent.length > 0 && (
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
            {emailsSent.map((inv, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 12px", background: COLORS.grassSoft, borderRadius: 10, fontSize: 13 }}>
                <span style={{ color: COLORS.ink }}>{inv}</span>
                <span style={{ color: COLORS.grass, fontWeight: 600, fontSize: 12 }}>Draft opened {ICON.check}</span>

        <div style={{ display: "flex", gap: 8 }}>
          <div className="tmooi-mono" style={{ flex: 1, fontSize: 12, color: COLORS.inkSoft, padding: "10px 12px", background: COLORS.bg, borderRadius: 10, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
            {inviteLink}
          </div>
          <button onClick={copyLink} style={{ padding: "0 16px", borderRadius: 10, border: "none", background: COLORS.goldGrad, color: COLORS.onGold, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
            {copied ? "Copied!" : "Copy link"}
          </button>
        </div>
        <div style={{ fontSize: 11, color: COLORS.inkSoft, marginTop: 10, lineHeight: 1.4 }}>
          Anyone with this link who creates or signs into an account gets prompted to join "{groupGoal.name}" — they'll pick which name is theirs (or add themselves) and choose their own reminder day.
        </div>
      </div>

  );

/* ---------------------------------------------------------------
   SETTINGS — account info, notification preferences, danger zone

function ToggleSwitch({ on, onClick }) {
  return (
    <button onClick={onClick} style={{
      width: 44, height: 26, borderRadius: 999, border: "none", cursor: "pointer", padding: 3,
      background: on ? COLORS.goldGrad : COLORS.line, display: "flex", justifyContent: on ? "flex-end" : "flex-start",
      transition: "background 0.15s ease",
    }}>
      <div style={{ width: 20, height: 20, borderRadius: "50%", background: on ? COLORS.onGold : "#F3EFE6", transition: "transform 0.15s ease" }} />
    </button>
  );
}

function SettingsScreen({ profile, uid, authEmail, isPremium, companionChangesUsed, onUpdateNotificationPrefs, onUpdateAppearance, onUpdateLanguageVoice, onUpdateCompanion, onUpgrade, onSignOut, onBack }) {
  const prefs = profile.notificationPrefs || { contributionReminders: true, inactivityReminders: true };
  const theme = profile.theme || "dark";
  const accentColor = profile.accentColor || "gold";
  const responseLanguage = profile.responseLanguage || "English";
  const voiceName = profile.voiceName || "";
  const [speechStyleInput, setSpeechStyleInput] = useState(profile.speechStyle || "");
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );
  const [availableVoices, setAvailableVoices] = useState([]);
  const [previewing, setPreviewing] = useState(false);

  useEffect(() => {
    if (typeof window.speechSynthesis === "undefined") return;
    const loadVoices = () => setAvailableVoices(window.speechSynthesis.getVoices());
    loadVoices();
    // Voice lists load asynchronously in most browsers — this fires once ready.
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }, []);

  const togglePref = async (key) => {
    const next = { ...prefs, [key]: !prefs[key] };
    // Ask for browser notification permission the first time someone
    // actually turns a reminder on — not before, so it's tied to a real
    // action instead of an unexplained popup on page load. This also
    // grabs a push token so reminders can arrive even when the app
    // is closed (see enablePushNotifications in the Firebase setup).
    if (next[key] && typeof Notification !== "undefined" && Notification.permission === "default") {
      await enablePushNotifications(uid);
      setNotifPermission(typeof Notification !== "undefined" ? Notification.permission : "unsupported");
    }
    onUpdateNotificationPrefs(next);
  };

  const handleSelectCompanion = (personalityId) => {
    if (personalityId === profile.companion.personality) return;
    if (!isPremium && companionChangesUsed >= 1) {
      onUpgrade();
      return;
    }
    onUpdateCompanion(personalityId);
  };

  const previewVoice = () => {
    if (typeof window.speechSynthesis === "undefined") return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance("This is how I'll sound when I talk you out of it.");
    utterance.rate = 1;
    if (voiceName) {
      const match = availableVoices.find((v) => v.name === voiceName);
      if (match) utterance.voice = match;
    }
    utterance.onend = () => setPreviewing(false);
    setPreviewing(true);
    window.speechSynthesis.speak(utterance);
  };

  return (
    <Shell>
      <FlowHeader title="Settings" onCancel={onBack} />

      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 10 }}>Account</div>
      <div style={{ ...cardStyle, marginBottom: 20 }}>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 4 }}>Signed in as</div>
        <div style={{ fontSize: 14.5, fontWeight: 600, color: COLORS.ink, marginBottom: 16 }}>{authEmail}</div>
        <button onClick={onSignOut} style={{ width: "100%", padding: "12px", borderRadius: 10, border: `1.5px solid ${COLORS.line}`, background: "none", color: COLORS.ink, fontWeight: 600, fontSize: 13.5, cursor: "pointer" }}>
          Sign out
        </button>
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 10 }}>Appearance</div>
      <div style={{ ...cardStyle, marginBottom: 20 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 10 }}>Theme</div>
        <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
          {[{ id: "dark", label: "🌙 Dark" }, { id: "light", label: "☀️ Light" }].map((t) => (
            <button key={t.id} onClick={() => onUpdateAppearance({ theme: t.id, accentColor })}
              style={{
                flex: 1, padding: "10px", borderRadius: 10, cursor: "pointer", fontWeight: 600, fontSize: 13,
                border: `1.5px solid ${theme === t.id ? COLORS.periwinkle : COLORS.line}`,
                background: theme === t.id ? COLORS.periwinkleSoft : "none",
                color: theme === t.id ? COLORS.ink : COLORS.inkSoft,
              }}>
              {t.label}
            </button>
          ))}
        </div>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 10 }}>Accent color</div>
        <div style={{ display: "flex", gap: 10 }}>
          {ACCENT_OPTIONS.map((a) => (
            <button key={a.id} onClick={() => onUpdateAppearance({ theme, accentColor: a.id })} title={a.label}
              style={{
                width: 38, height: 38, borderRadius: "50%", cursor: "pointer", background: a.swatch,
                border: accentColor === a.id ? `3px solid ${COLORS.ink}` : `3px solid transparent`,
                boxShadow: accentColor === a.id ? `0 0 0 2px ${a.swatch}` : "none",
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
              {accentColor === a.id && <span style={{ color: "#fff", fontSize: 14, textShadow: "0 1px 2px rgba(0,0,0,0.4)" }}>✓</span>}
            </button>
          ))}
        </div>
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 10 }}>Your companion</div>
      <div style={{ ...cardStyle, marginBottom: 20 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
          {PERSONALITIES.map((p) => (
            <button key={p.id} onClick={() => handleSelectCompanion(p.id)}
              style={{
                display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 12, textAlign: "left",
                border: `1.5px solid ${profile.companion.personality === p.id ? COLORS.periwinkle : COLORS.line}`,
                background: profile.companion.personality === p.id ? COLORS.periwinkleSoft : COLORS.glass, cursor: "pointer",
              }}>
              <span style={{ fontSize: 20 }}>{p.emoji}</span>
              <span>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{p.label}</div>
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>{p.desc}</div>
              </span>
            </button>
          ))}
        </div>
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, lineHeight: 1.4 }}>
          {isPremium
            ? "Premium includes unlimited companion changes."
            : companionChangesUsed >= 1
              ? "You've used your free companion change — upgrade to switch again."
              : "Free plan includes 1 companion change."}
        </div>
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 10 }}>Language &amp; voice</div>
      <div style={{ ...cardStyle, marginBottom: 20 }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>Companion writes in</div>
        <select value={responseLanguage} onChange={(e) => onUpdateLanguageVoice({ responseLanguage: e.target.value, voiceName, speechStyle: speechStyleInput })}
          style={{ ...inputStyle, marginBottom: 18, padding: "10px 12px", fontSize: 14, cursor: "pointer" }}>
          {LANGUAGE_OPTIONS.map((lang) => <option key={lang} value={lang}>{lang}</option>)}
        </select>
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: -12, marginBottom: 18, lineHeight: 1.4 }}>
          Changes the language your companion writes its messages in.
        </div>

        <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>How you actually talk</div>
        <textarea value={speechStyleInput} onChange={(e) => setSpeechStyleInput(e.target.value)}
          onBlur={() => onUpdateLanguageVoice({ responseLanguage, voiceName, speechStyle: speechStyleInput })}
          placeholder={'e.g. "I talk fast, drop a lot of \'honestly\' and \'lowkey\', don\'t really do formal grammar"'}
          rows={3}
          style={{ ...inputStyle, marginBottom: 10, padding: "12px", fontSize: 13.5, resize: "vertical", lineHeight: 1.5 }} />
        <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginBottom: 18, lineHeight: 1.4 }}>
          Describe your own natural voice in your own words — slang, rhythm, whatever feels like you. Your companion will try to actually sound like it, on top of the personality you picked, not replace it.
        </div>

        <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 8 }}>Listen voice</div>
        {availableVoices.length === 0 ? (
          <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.4 }}>
            No extra voices found on this device — the 🔊 listen button will use your browser's default voice.
          </div>
        ) : (
          <React.Fragment>
            <select value={voiceName} onChange={(e) => onUpdateLanguageVoice({ responseLanguage, voiceName: e.target.value, speechStyle: speechStyleInput })}
              style={{ ...inputStyle, marginBottom: 12, padding: "10px 12px", fontSize: 14, cursor: "pointer" }}>
              <option value="">System default</option>
              {availableVoices.map((v) => <option key={v.name} value={v.name}>{v.name} ({v.lang})</option>)}
            </select>
            <button onClick={previewVoice} style={{ width: "100%", padding: "10px", borderRadius: 10, border: `1.5px solid ${COLORS.line}`, background: "none", color: COLORS.ink, fontWeight: 600, fontSize: 13, cursor: "pointer" }}>
              {previewing ? "🔊 Playing..." : "🔊 Preview this voice"}
            </button>
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 10, lineHeight: 1.4 }}>
              This is your device's own set of voices — different phones, computers, and browsers offer different accents and languages here. Not every voice is available everywhere.
            </div>
          </React.Fragment>
        )}
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 10 }}>Notifications</div>
      <div style={{ ...cardStyle, marginBottom: 20 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0" }}>
          <div style={{ paddingRight: 12 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 2 }}>Contribution reminders</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.4 }}>Nudge me when a group goal payment is coming up or overdue.</div>
          </div>
          <ToggleSwitch on={prefs.contributionReminders} onClick={() => togglePref("contributionReminders")} />
        </div>
        <div style={{ borderTop: `1px solid ${COLORS.line}`, margin: "12px 0" }} />
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0" }}>
          <div style={{ paddingRight: 12 }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 2 }}>Inactivity reminders</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.4 }}>Check in on me if I haven't logged a purchase in a week.</div>
          </div>
          <ToggleSwitch on={prefs.inactivityReminders} onClick={() => togglePref("inactivityReminders")} />
        </div>
        {notifPermission === "denied" && (prefs.contributionReminders || prefs.inactivityReminders) && (
          <div style={{ marginTop: 12, fontSize: 11.5, color: COLORS.inkSoft, background: COLORS.glass, borderRadius: 8, padding: "8px 10px", lineHeight: 1.4 }}>
            Browser notifications are blocked for this site, so reminders will still show inside the app, just not as a system pop-up. You can allow them in your browser's site settings.
          </div>
        )}
        <div style={{ marginTop: 12, fontSize: 11, color: COLORS.inkSoft, lineHeight: 1.4 }}>
          Reminders show up in-app whenever you open Talk Me Out Of It. They don't yet arrive as background push notifications while the app is closed — that needs a bit more backend work.
        </div>
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.coral, textTransform: "uppercase", letterSpacing: 0.4, marginBottom: 10 }}>Danger zone</div>
      <div style={{ ...cardStyle, border: `1px solid ${COLORS.coralSoft}` }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink, marginBottom: 4 }}>Delete account</div>
        <div style={{ fontSize: 12, color: COLORS.inkSoft, lineHeight: 1.4, marginBottom: 14 }}>
          Permanently erases your profile, check-ins, and group goal contributions.
        </div>
        <button disabled style={{ width: "100%", padding: "12px", borderRadius: 10, border: `1.5px solid ${COLORS.line}`, background: "none", color: COLORS.inkSoft, fontWeight: 600, fontSize: 13.5, cursor: "not-allowed" }}>
          Coming soon
        </button>
      </div>
    </Shell>
  );
}

/* ---------------------------------------------------------------
   CREATE GOAL — add a personal goal after onboarding
----------------------------------------------------------------*/
function CreateGoal({ onCreate, onCancel }) {
  const [category, setCategory] = useState(null);
  const [name, setName] = useState("");
  const [target, setTarget] = useState("");
  const [current, setCurrent] = useState("");
  const [targetDate, setTargetDate] = useState("");
  const [step, setStep] = useState(0);

  return (
    <Shell>
      <FlowHeader title="New personal goal" onCancel={onCancel} />
      {step === 0 && (
        <div>
          <h3 style={qTitle}>What's this one for?</h3>
          <p style={{ color: COLORS.inkSoft, fontSize: 13.5, marginBottom: 14 }}>Big or small — a trip fund or "brunch this weekend" both work.</p>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {GOAL_CATEGORIES.map((g) => (
              <button key={g.id} onClick={() => { setCategory(g.id); setName(g.id === "custom" ? "" : g.label); }}
                style={{ padding: "16px 12px", borderRadius: 14, textAlign: "left", border: `1.5px solid ${category === g.id ? COLORS.periwinkle : COLORS.line}`, background: category === g.id ? COLORS.periwinkleSoft : COLORS.glass, cursor: "pointer" }}>
                <div style={{ fontSize: 22, marginBottom: 6 }}>{g.emoji}</div>
                <div style={{ fontSize: 13.5, fontWeight: 600, color: COLORS.ink }}>{g.label}</div>
              </button>
            ))}
          </div>
          <div style={{ marginTop: 22 }}><PrimaryButton onClick={() => setStep(1)} disabled={!category}>Continue {ICON.arrowRight}</PrimaryButton></div>
        </div>
      )}
      {step === 1 && (
        <div>
          <h3 style={qTitle}>Name it & set a target</h3>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Brunch Fund" style={inputStyle} />
          <div style={{ display: "flex", gap: 10, marginTop: 10 }}>
            <input value={target} onChange={(e) => setTarget(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="Target $" inputMode="decimal" style={inputStyle} />
            <input value={current} onChange={(e) => setCurrent(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="Already saved $" inputMode="decimal" style={inputStyle} />
          </div>
          <input type="date" value={targetDate} onChange={(e) => setTargetDate(e.target.value)} placeholder="Target date (optional)" style={{ ...inputStyle, marginTop: 10 }} />
          <div style={{ marginTop: 22 }}>
            <PrimaryButton onClick={() => onCreate({
              id: `goal-${Date.now()}`, name: name || "My Goal", category,
              targetAmount: parseFloat(target) || 0, currentAmount: parseFloat(current) || 0,
              targetDate: targetDate || null, celebrated: false,
            })} disabled={!name.trim() || !target}>Create goal {ICON.sparkles}</PrimaryButton>
          </div>
        </div>
      )}
    </Shell>
  );
}

/* ---------------------------------------------------------------
   ADD FUNDS — manual contribution to a personal goal
----------------------------------------------------------------*/
function AddFunds({ goal, onAdd, onCancel }) {
  const [amount, setAmount] = useState("");
  return (
    <Shell>
      <FlowHeader title={`Add to ${goal.name}`} onCancel={onCancel} />
      <p style={{ color: COLORS.inkSoft, fontSize: 13.5, marginBottom: 16 }}>Record money you've already saved toward this goal. This app doesn't move or hold your money — just tracks it.</p>
      <input value={amount} onChange={(e) => setAmount(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="Amount $" inputMode="decimal" style={inputStyle} autoFocus />
      <div style={{ marginTop: 22 }}>
        <PrimaryButton onClick={() => onAdd(parseFloat(amount) || 0)} disabled={!amount} style={{ background: COLORS.grass }}>{ICON.check} Add ${amount || 0}</PrimaryButton>
      </div>
    </Shell>
  );
}

function buildMonthlyReviewPrompt(companion, profile, stats) {
  const voice = {
    bestie: "Talk like a supportive best friend. Warm, playful, honest.",
    savage: "Blunt and funny. Don't soften things, but never cruel.",
    calm: "Gentle and reflective. Ask questions more than you assert.",
    no_nonsense: "Direct, practical, numbers-forward. Minimal humor.",
    unhinged: "Chaotic and exaggerated for comedic effect, still on the user's side.",
  }[companion.personality];

  const languageLine = profile.responseLanguage && profile.responseLanguage !== "English"
    ? `\nRespond entirely in ${profile.responseLanguage}, not English.` : "";
  const speechStyleLine = profile.speechStyle?.trim()
    ? `\nThe user described how they actually talk: "${profile.speechStyle.trim()}". Let this genuinely shape your word choice, slang, and rhythm — don't just mention it, actually sound like it — while staying true to your personality above.` : "";

  return `You are ${profile.nickname || profile.name}'s spending accountability companion, writing their end-of-month review inside "Talk Me Out of It".
Personality: ${companion.personality}. ${voice}
Tone: ${companion.tone}.${languageLine}${speechStyleLine}

Ground rules: not a financial advisor, never invent numbers beyond what's given, never shame, keep it to a short reflection (2-3 sentences) plus exactly 2-3 concrete, specific strategies for next month as a bulleted list.

This month's data:
- Total logged spending: $${stats.totalSpend.toFixed(2)}
- Top categories: ${stats.topCategories.map(c => `${c.category} ($${c.amount.toFixed(0)})`).join(", ") || "none logged"}
- Purchase check-ins: ${stats.worthIt} worth it, ${stats.wait} put on wait, ${stats.skip} skipped
- Money kept by skipping/abandoning purchases: $${stats.avoided.toFixed(2)}
- Goals: ${stats.goalsSummary || "none"}
- Spending profile: impulse shopper: ${profile.spendingProfile?.impulseShopper ? "yes" : "no"}, shops when stressed: ${profile.spendingProfile?.shopsStressed ? "yes" : "no"}, regret frequency: ${profile.spendingProfile?.regretFrequency || "unknown"}

Write the review now, in character.`;
}

function MonthlyReview({ profile, purchases, onBack }) {
  const [loading, setLoading] = useState(true);
  const [message, setMessage] = useState("");
  const [stats, setStats] = useState(null);

  useEffect(() => {
    const now = new Date();
    const inMonth = (dateVal) => {
      const d = new Date(dateVal);
      return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    };
    const log = (profile.spendingLog || []).filter((e) => inMonth(e.date));
    const totalSpend = log.reduce((s, e) => s + e.amount, 0);
    const byCategory = {};
    log.forEach((e) => { byCategory[e.category] = (byCategory[e.category] || 0) + e.amount; });
    const topCategories = Object.entries(byCategory).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([category, amount]) => ({ category, amount }));

    const monthPurchases = purchases.filter((p) => inMonth(p.createdAt));
    const worthIt = monthPurchases.filter((p) => p.decision?.recommendation === "WORTH_IT").length;
    const wait = monthPurchases.filter((p) => p.decision?.recommendation === "WAIT").length;
    const skip = monthPurchases.filter((p) => p.decision?.recommendation === "SKIP").length;
    const avoided = monthPurchases.filter((p) => p.outcome === "skipped" || p.waitOutcome === "abandoned").reduce((s, p) => s + p.price, 0);
    const goalsSummary = profile.goals.filter((g) => !g.archived).map((g) => `${g.name}: $${g.currentAmount}/$${g.targetAmount}`).join("; ");

    const s = { totalSpend, topCategories, worthIt, wait, skip, avoided, goalsSummary };
    setStats(s);

    const sys = buildMonthlyReviewPrompt(profile.companion, profile, s);
    callCompanion(sys, "Give me my monthly review.").then((msg) => {
      setMessage(msg);
      setLoading(false);
    });
  }, []);

  return (
    <Shell>
      <FlowHeader title="Your month in review" onCancel={onBack} />
      {loading ? (
        <div style={{ textAlign: "center", paddingTop: 80 }}>
          <div style={{ fontSize: 32, marginBottom: 14 }}>📝</div>
          <div style={{ color: COLORS.inkSoft, fontSize: 14 }}>Pulling your month together...</div>
        </div>
      ) : (
        <div>
          <div style={{ background: COLORS.periwinkleSoft, borderRadius: 16, padding: "16px 18px", marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.periwinkle, textTransform: "uppercase", letterSpacing: 0.5 }}>
                {PERSONALITIES.find((p) => p.id === profile.companion.personality)?.emoji} Your companion
              </div>
              <SpeakButton text={message} voiceName={profile.voiceName} />
            </div>
            <div style={{ fontSize: 14.5, color: COLORS.ink, lineHeight: 1.6, whiteSpace: "pre-line" }}>{message}</div>
          </div>
          <div style={cardStyle}>
            <ReceiptRow label="Total logged spending" value={`$${stats.totalSpend.toFixed(2)}`} bold />
            {stats.topCategories.map((c, i) => (
              <ReceiptRow key={i} label={c.category} value={`$${c.amount.toFixed(2)}`} />
            ))}
            <div style={{ borderTop: `1px dashed ${COLORS.line}`, margin: "8px 0" }} />
            <ReceiptRow label="Worth it / Wait / Skip" value={`${stats.worthIt} / ${stats.wait} / ${stats.skip}`} />
            <ReceiptRow label="Kept by skipping" value={`$${stats.avoided.toFixed(2)}`} />
          </div>
        </div>
      )}
    </Shell>
  );
}
