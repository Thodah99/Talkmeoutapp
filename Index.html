function TalkMeOutOfIt() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = checking, null = signed out
  const [loading, setLoading] = useState(true);
  const [profile, setProfile] = useState(null);
  const [purchases, setPurchases] = useState([]);
  const [groupGoals, setGroupGoals] = useState([]);
  const [view, setView] = useState("dashboard"); // dashboard | newPurchase | celebration | newGroupGoal | groupGoalDetail | newGoal | addFunds | logSpending | monthlyReview
  const [celebrationAmount, setCelebrationAmount] = useState(0);
  const [celebrationGoal, setCelebrationGoal] = useState(null);
  const [celebrationMode, setCelebrationMode] = useState("saved");
  const [waitCheckInId, setWaitCheckInId] = useState(null);
  const [phoneAFriendPurchase, setPhoneAFriendPurchase] = useState(null); // { purchase, decision, goal, waitDuration }
  const [postingToFeed, setPostingToFeed] = useState(false);
  const [selectedGroupGoalId, setSelectedGroupGoalId] = useState(null);
  const [selectedGoalId, setSelectedGoalId] = useState(null);
  const [activeTip, setActiveTip] = useState(null);
  const [paywallReason, setPaywallReason] = useState(null);
  const [celebrationImpactPercent, setCelebrationImpactPercent] = useState(null);
  const [pendingInviteCode, setPendingInviteCode] = useState(() => new URLSearchParams(window.location.search).get("invite"));
  const [showIntro, setShowIntro] = useState(() => !localStorage.getItem("tmooi_intro_seen_v3"));

  const isPremium = profile?.subscription === "premium";
  const FREE_TRIES = 3; // check-ins/month on the free plan
  const triesLeft = Math.max(0, FREE_TRIES - purchases.length);
  const companionChangesUsed = profile?.companionChangesUsed || 0;
  const phoneAFriendPostsUsed = profile?.phoneAFriendPostsUsed || 0;

  useEffect(() => {
    const unsubscribe = auth.onAuthStateChanged((user) => setAuthUser(user));
    return unsubscribe;
  }, []);

  useEffect(() => {
    // Coming back from Stripe Checkout — clean the "?upgraded=true" out of
    // the address bar. The subscription flag itself comes from Firestore
    // (set by the webhook), not from this param — this is just tidy-up.
    if (window.location.search.includes("upgraded=true")) {
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);

  useEffect(() => {
    // Apply the person's theme + accent color choice to the whole page —
    // every color in the app reads from these CSS variables, so this one
    // line repaints everything instantly.
    document.documentElement.setAttribute("data-theme", profile?.theme || "dark");
    document.documentElement.setAttribute("data-accent", profile?.accentColor || "gold");
  }, [profile?.theme, profile?.accentColor]);

  const handleSignOut = async () => {
    await auth.signOut();
    setProfile(null);
    setPurchases([]);
    setGroupGoals([]);
    setView("dashboard");
  };

  const handleUpdateNotificationPrefs = async (prefs) => {
    const updated = { ...profile, notificationPrefs: prefs };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
  };

  const handleUpdateAppearance = async ({ theme, accentColor }) => {
    const updated = { ...profile, theme, accentColor };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
  };

  const handleUpdateLanguageVoice = async ({ responseLanguage, voiceName, speechStyle }) => {
    const updated = { ...profile, responseLanguage, voiceName, speechStyle };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
  };

  // Changing companion is free-limited (1 change on the free plan) so it's
  // gated the same way goals/group goals are — checked where it's triggered,
  // not here. This just performs the actual swap once that check passes.
  const handleUpdateCompanion = async (personality) => {
    const updated = {
      ...profile,
      companion: { ...profile.companion, personality },
      companionChangesUsed: isPremium ? companionChangesUsed : companionChangesUsed + 1,
    };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
  };

  // Monthly Review calls the AI companion for a fresh summary every time
  // it's opened, so free access is capped at one use total rather than
  // left unlimited like everything else on the free plan.
  const handleUseMonthlyReview = async () => {
    const updated = { ...profile, monthlyReviewsUsed: (profile.monthlyReviewsUsed || 0) + 1 };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
    setView("monthlyReview");
  };

  const handleRegretFeedback = async (purchaseId, feedback) => {
    const updated = purchases.map((p) => p.id === purchaseId ? { ...p, regretFeedback: feedback, regretFeedbackAt: Date.now() } : p);
    setPurchases(updated);
    await updatePurchase(authUser.uid, purchaseId, { regretFeedback: feedback, regretFeedbackAt: Date.now() });
  };

  const [checkingOut, setCheckingOut] = useState(false);

  const handleUpgrade = async (plan) => {
    // Real premium status can only be set by the backend, after a verified
    // Stripe payment (see the stripeWebhook Cloud Function) — a signed-in
    // client is blocked from setting this directly by the Firestore rules.
    // This sends the user to a Stripe Payment Link, tagged with their uid
    // so the webhook knows whose account to upgrade once payment completes.
    setCheckingOut(true);
    const paymentLink = plan === "monthly" ? STRIPE_PAYMENT_LINK_MONTHLY : STRIPE_PAYMENT_LINK_YEARLY;
    window.location.href = `${paymentLink}?client_reference_id=${authUser.uid}`;
  };

  useEffect(() => {
    if (authUser === undefined) return; // still checking auth state
    if (authUser === null) { setLoading(false); return; } // signed out — show AuthScreen
    (async () => {
      setLoading(true);
      let p = await loadProfile(authUser.uid);
      const pu = await loadPurchases(authUser.uid);
      const gg = await loadGroupGoals(authUser.uid);
      // migrate older single-goal profiles to the goals array
      if (p && p.goal && !p.goals) {
        p = { ...p, goals: [p.goal] };
        delete p.goal;
      }
      if (p && !p.spendingLog) {
        p = { ...p, spendingLog: [] };
      }
      // Track distinct DAYS the person has opened the app (not raw opens —
      // reopening 3x in one sitting shouldn't count as "showing up" 3 times).
      // Every 3rd distinct day, surface a financial literacy tip, once.
      if (p) {
        const today = todayLocalStr();
        if (p.lastLoginDate !== today) {
          const distinctLoginDays = (p.distinctLoginDays || 0) + 1;
          p = { ...p, lastLoginDate: today, distinctLoginDays };
          if (distinctLoginDays % 3 === 0) {
            setActiveTip(getLoginTip(distinctLoginDays));
          }
        }
        await saveProfile(authUser.uid, p);
      }
      setProfile(p);
      setPurchases(pu);
      setGroupGoals(gg);
      setLoading(false);
    })();
  }, [authUser]);

  const handleCreateGroupGoal = async (newGroup) => {
    setGroupGoals([newGroup, ...groupGoals]);
    await saveGroupGoal(newGroup);
    setSelectedGroupGoalId(newGroup.id);
    setView("groupGoalDetail");
  };

  const handleToggleContribution = async (participantId, scheduleIndex) => {
    let changedGroup = null;
    const updated = groupGoals.map((g) => {
      if (g.id !== selectedGroupGoalId) return g;
      const participants = g.participants.map((p) => {
        if (p.id !== participantId) return p;
        const schedule = p.schedule.map((c, i) => i === scheduleIndex ? { ...c, completed: !c.completed } : c);
        return { ...p, schedule };
      });
      const currentAmount = participants.reduce((s, p) => s + p.schedule.filter((c) => c.completed).reduce((s2, c) => s2 + c.amount, 0), 0);
      const rounded = Math.round(currentAmount * 100) / 100;
      // If the total drops back below target (someone un-logs a payment),
      // un-set celebrated so the gold card can fire again once it's re-met.
      const stillMet = rounded >= g.targetAmount;
      changedGroup = { ...g, participants, currentAmount: rounded, celebrated: stillMet ? g.celebrated : false };
      return changedGroup;
    });
    setGroupGoals(updated);
    if (changedGroup) {
      await updateGroupGoal(changedGroup.id, {
        participants: changedGroup.participants,
        currentAmount: changedGroup.currentAmount,
        celebrated: changedGroup.celebrated,
      });
    }
    // No auto-popup here — the gold "Goal met" card on the dashboard is
    // what surfaces the completion now, and it's tapped when they're ready.
  };

  // Called after someone successfully joins via an invite link/code.
  const handleJoinedGroupGoal = (joinedGroup) => {
    setGroupGoals((prev) => {
      const withoutOld = prev.filter((g) => g.id !== joinedGroup.id);
      return [joinedGroup, ...withoutOld];
    });
    setSelectedGroupGoalId(joinedGroup.id);
    setPendingInviteCode(null);
    window.history.replaceState({}, "", window.location.pathname);
    setView("groupGoalDetail");
  };

  const handleOpenGoalCelebration = (goalId) => {
    const goal = profile.goals.find((g) => g.id === goalId);
    if (!goal) return;
    setCelebrationMode("personal_goal_met");
    setCelebrationAmount(goal.currentAmount);
    setCelebrationGoal(goal);
    setCelebrationImpactPercent(null);
    setView("celebration");
  };

  const handleOpenGroupGoalCelebration = (groupGoalId) => {
    const g = groupGoals.find((gg) => gg.id === groupGoalId);
    if (!g) return;
    setCelebrationMode("group_complete");
    setCelebrationAmount(g.currentAmount);
    setCelebrationGoal(g);
    setCelebrationImpactPercent(null);
    setView("celebration");
  };

  const handleCelebrationContinue = async () => {
    if (celebrationMode === "personal_goal_met" && celebrationGoal) {
      // Archiving (not just marking celebrated) is what clears it out of
      // "My Goals" and frees the slot to start a brand new goal.
      const updated = { ...profile, goals: profile.goals.map((g) => g.id === celebrationGoal.id ? { ...g, celebrated: true, archived: true, completedAt: Date.now() } : g) };
      setProfile(updated);
      await saveProfile(authUser.uid, updated);
    }
    if (celebrationMode === "group_complete" && celebrationGoal) {
      // Only the person who created the group goal can dismiss it for
      // everyone — other participants can still open and view this
      // screen, but their tap doesn't clear the card from the feed.
      const me = celebrationGoal.participants.find((p) => p.uid === authUser.uid);
      const isOwner = me && me.id === celebrationGoal.ownerParticipantId;
      if (isOwner) {
        const updatedGroups = groupGoals.map((g) => g.id === celebrationGoal.id ? { ...g, celebrated: true, archived: true, completedAt: Date.now() } : g);
        setGroupGoals(updatedGroups);
        await updateGroupGoal(celebrationGoal.id, { celebrated: true, archived: true, completedAt: Date.now() });
      }
    }
    setView("dashboard");
  };

  const handleOnboardingComplete = async (newProfile) => {
    setProfile(newProfile);
    await saveProfile(authUser.uid, newProfile);
  };

  const handleCreateGoal = async (newGoal) => {
    const updated = { ...profile, goals: [...profile.goals, newGoal] };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
    setView("dashboard");
  };

  const handleAddFunds = async (amount) => {
    const updated = {
      ...profile,
      goals: profile.goals.map((g) => g.id === selectedGoalId ? { ...g, currentAmount: Math.round((g.currentAmount + amount) * 100) / 100 } : g),
    };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
    setView("dashboard");
  };

  const handleLogSpending = async (entry) => {
    const updated = { ...profile, spendingLog: [{ id: `s-${Date.now()}`, ...entry }, ...(profile.spendingLog || [])] };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
    setView("dashboard");
  };

  const handlePurchaseDone = async ({ purchase, decision, outcome, waitDuration, goal }) => {
    const REGRET_CHECK_DELAY_MS = 14 * 86400000; // 2 weeks
    const record = {
      id: `p-${Date.now()}`,
      itemName: purchase.itemName,
      price: purchase.price,
      category: purchase.category,
      needOrWant: purchase.needOrWant,
      ownsSimilar: purchase.ownsSimilar,
      usage: purchase.usage,
      fullPrice: purchase.fullPrice,
      trigger: purchase.trigger,
      wantScore: purchase.wantScore,
      decision,
      outcome,
      waitDuration,
      goalId: goal ? goal.id : null,
      waitOutcome: outcome === "waiting" ? "pending" : null,
      // Only resolved outcomes get a follow-up scheduled — a pending wait
      // doesn't have a real outcome yet, so there's nothing to ask about.
      regretCheckDate: outcome === "waiting" ? null : Date.now() + REGRET_CHECK_DELAY_MS,
      regretFeedback: null,
      createdAt: Date.now(),
    };
    const newPurchases = [record, ...purchases];
    setPurchases(newPurchases);
    await addPurchase(authUser.uid, record);

    // Feeds the scheduled Cloud Function (see scheduled-reminders-functions.js)
    // that sends the weekly proactive check-in — it can't run the pattern
    // logic itself since it doesn't have live client state, so the client
    // writes the result here after every check-in.
    const patterns = getRecentPatterns(newPurchases);
    const patternFields = {
      lastCheckInAt: Date.now(),
      lastDetectedTopTrigger: patterns?.isImpulsePattern ? patterns.topTrigger : null,
    };
    const profileWithPattern = { ...profile, ...patternFields };
    setProfile(profileWithPattern);
    await saveProfile(authUser.uid, profileWithPattern);

    if (outcome === "skipped") {
      const updated = { ...profileWithPattern, avoidedSpending: (profile.avoidedSpending || 0) + purchase.price };
      setProfile(updated);
      await saveProfile(authUser.uid, updated);
      setCelebrationMode("saved");
      setCelebrationAmount(purchase.price);
      setCelebrationGoal(goal || null);
      setCelebrationImpactPercent(null);
      setView("celebration");
      return;
    }

    if (outcome === "bought" || outcome === "bought_anyway") {
      setCelebrationMode("bought");
      setCelebrationAmount(purchase.price);
      setCelebrationGoal(goal || null);
      setCelebrationImpactPercent(decision?.goalImpactPercent ?? null);
      setView("celebration");
      return;
    }

    setView("dashboard");
  };

  // "Never mind, just wait" from the compose screen — resolves as a plain
  // wait, same as if Phone a Friend had never been tapped.
  const handleSkipPhoneAFriend = async () => {
    if (phoneAFriendPurchase) {
      await handlePurchaseDone({ ...phoneAFriendPurchase, outcome: "waiting" });
    }
    setPhoneAFriendPurchase(null);
  };

  const handlePostToFeed = async (photoDataUrl, comment) => {
    if (!phoneAFriendPurchase) return;
    setPostingToFeed(true);
    const { purchase, decision, goal, waitDuration } = phoneAFriendPurchase;
    const record = {
      id: `p-${Date.now()}`,
      itemName: purchase.itemName, price: purchase.price, category: purchase.category,
      needOrWant: purchase.needOrWant, ownsSimilar: purchase.ownsSimilar, usage: purchase.usage,
      fullPrice: purchase.fullPrice, trigger: purchase.trigger, wantScore: purchase.wantScore,
      decision, outcome: "waiting", waitDuration,
      goalId: goal ? goal.id : null,
      waitOutcome: "pending",
      feedPostId: null,
      regretCheckDate: null, regretFeedback: null,
      createdAt: Date.now(),
    };
    const post = await createFeedPost(authUser.uid, record, photoDataUrl, comment);
    if (post) record.feedPostId = post.id;

    const newPurchases = [record, ...purchases];
    setPurchases(newPurchases);
    await addPurchase(authUser.uid, record);

    const patterns = getRecentPatterns(newPurchases);
    const profileWithPattern = {
      ...profile, lastCheckInAt: Date.now(),
      lastDetectedTopTrigger: patterns?.isImpulsePattern ? patterns.topTrigger : null,
      phoneAFriendPostsUsed: isPremium ? phoneAFriendPostsUsed : phoneAFriendPostsUsed + 1,
    };
    setProfile(profileWithPattern);
    await saveProfile(authUser.uid, profileWithPattern);

    setPostingToFeed(false);
    setPhoneAFriendPurchase(null);
    setView("dashboard");
  };

  const handleSaveCatchUpPlan = async (goalId, planText) => {
    const updated = { ...profile, goals: profile.goals.map((g) => g.id === goalId ? { ...g, catchUpPlan: planText } : g) };
    setProfile(updated);
    await saveProfile(authUser.uid, updated);
  };

  const handleResolveWait = (purchaseId) => {
    setWaitCheckInId(purchaseId);
    setView("waitCheckIn");
  };

  const handleWaitDecision = async (stillWant) => {
    const target = purchases.find((p) => p.id === waitCheckInId);
    if (!target) { setView("dashboard"); return; }
    const REGRET_CHECK_DELAY_MS = 14 * 86400000; // 2 weeks
    const waitOutcome = stillWant ? "bought" : "abandoned";
    const regretCheckDate = Date.now() + REGRET_CHECK_DELAY_MS;
    const updated = purchases.map((p) => p.id === waitCheckInId ? { ...p, waitOutcome, regretCheckDate } : p);
    setPurchases(updated);
    await updatePurchase(authUser.uid, waitCheckInId, { waitOutcome, regretCheckDate });

    if (!stillWant) {
      const updatedProfile = { ...profile, avoidedSpending: (profile.avoidedSpending || 0) + target.price };
      setProfile(updatedProfile);
      await saveProfile(authUser.uid, updatedProfile);
    }

    setCelebrationMode(stillWant ? "bought" : "saved");
    setCelebrationAmount(target.price);
    setCelebrationGoal(profile.goals.find((g) => g.id === target.goalId) || null);
    setCelebrationImpactPercent(target.decision?.goalImpactPercent ?? null);
    setWaitCheckInId(null);
    setView("celebration");
  };

  if (showIntro) {
    return <IntroDeck onComplete={() => { localStorage.setItem("tmooi_intro_seen_v3", "1"); setShowIntro(false); }} />;
  }

  if (authUser === undefined || loading) {
    return <Shell><div style={{ textAlign: "center", paddingTop: 120, color: COLORS.inkSoft }}>Loading...</div></Shell>;
  }

  if (authUser === null) {
    return <AuthScreen />;
  }

  if (!profile) {
    return <Onboarding onComplete={handleOnboardingComplete} authEmail={authUser.email} />;
  }

  if (pendingInviteCode) {
    return <JoinGroupGoal inviteCode={pendingInviteCode} uid={authUser.uid}
      onJoined={handleJoinedGroupGoal}
      onSkip={() => { setPendingInviteCode(null); window.history.replaceState({}, "", window.location.pathname); }} />;
  }

  if (view === "celebration") {
    return <CelebrationScreen mode={celebrationMode} goal={celebrationGoal} amount={celebrationAmount} impactPercent={celebrationImpactPercent} onSaveCatchUpPlan={handleSaveCatchUpPlan} onContinue={handleCelebrationContinue} />;
  }

  if (view === "waitCheckIn") {
    const target = purchases.find((p) => p.id === waitCheckInId);
    if (!target) { setView("dashboard"); return null; }
    return <WaitCheckIn purchase={target} onDecide={handleWaitDecision} onCancel={() => { setWaitCheckInId(null); setView("dashboard"); }} />;
  }

  if (view === "newPurchase") {
    return (
      <React.Fragment>
        <NewPurchaseFlow profile={profile} purchases={purchases} onDone={handlePurchaseDone}
          isPremium={isPremium} phoneAFriendPostsUsed={phoneAFriendPostsUsed}
          onPhoneAFriend={(ctx) => {
            if (!isPremium && phoneAFriendPostsUsed >= 1) {
              setPaywallReason("Free plan includes 1 Phone a Friend post. Upgrade to post more and get the crowd's take anytime.");
              return;
            }
            setPhoneAFriendPurchase(ctx);
            setView("phoneAFriendCompose");
          }}
          onCancel={() => setView("dashboard")} />
        {paywallReason && <PaywallModal reason={paywallReason} onUpgrade={handleUpgrade} onClose={() => setPaywallReason(null)} checkingOut={checkingOut} />}
      </React.Fragment>
    );
  }

  if (view === "phoneAFriendCompose") {
    if (!phoneAFriendPurchase) { setView("dashboard"); return null; }
    return <PhoneAFriendCompose itemName={phoneAFriendPurchase.purchase.itemName} price={phoneAFriendPurchase.purchase.price}
      posting={postingToFeed} onPost={handlePostToFeed} onSkip={handleSkipPhoneAFriend} />;
  }

  if (view === "publicFeed") {
    return <PublicFeed uid={authUser.uid} onBack={() => setView("dashboard")} />;
  }

  if (view === "newGroupGoal") {
    return <CreateGroupGoal profile={profile} uid={authUser.uid} onCreate={handleCreateGroupGoal} onCancel={() => setView("dashboard")} />;
  }

  if (view === "groupGoalDetail") {
    const gg = groupGoals.find((g) => g.id === selectedGroupGoalId);
    if (!gg) { setView("dashboard"); return null; }
    return <GroupGoalDetail groupGoal={gg} uid={authUser.uid} onBack={() => setView("dashboard")} onToggleContribution={handleToggleContribution} />;
  }

  if (view === "newGoal") {
    return <CreateGoal onCreate={handleCreateGoal} onCancel={() => setView("dashboard")} />;
  }

  if (view === "addFunds") {
    const goal = profile.goals.find((g) => g.id === selectedGoalId);
    if (!goal) { setView("dashboard"); return null; }
    return <AddFunds goal={goal} onAdd={handleAddFunds} onCancel={() => setView("dashboard")} />;
  }

  if (view === "logSpending") {
    return <LogSpending onLog={handleLogSpending} onCancel={() => setView("dashboard")} />;
  }

  if (view === "monthlyReview") {
    return <MonthlyReview profile={profile} purchases={purchases} onBack={() => setView("dashboard")} />;
  }

  if (view === "settings") {
    return (
      <React.Fragment>
        <SettingsScreen
          profile={profile}
          uid={authUser.uid}
          authEmail={authUser.email}
          isPremium={isPremium}
          companionChangesUsed={companionChangesUsed}
          onUpdateNotificationPrefs={handleUpdateNotificationPrefs}
          onUpdateAppearance={handleUpdateAppearance}
          onUpdateLanguageVoice={handleUpdateLanguageVoice}
          onUpdateCompanion={handleUpdateCompanion}
          onUpgrade={() => setPaywallReason("Free plan includes 1 companion change. Upgrade to switch anytime.")}
          onSignOut={handleSignOut}
          onBack={() => setView("dashboard")}
        />
        {paywallReason && <PaywallModal reason={paywallReason} onUpgrade={handleUpgrade} onClose={() => setPaywallReason(null)} checkingOut={checkingOut} />}
      </React.Fragment>
    );
  }

  return (
    <React.Fragment>
      <Dashboard
        profile={profile}
        uid={authUser.uid}
        purchases={purchases}
        groupGoals={groupGoals}
        triesLeft={triesLeft}
        isPremium={isPremium}
        monthlyReviewsUsed={profile.monthlyReviewsUsed}
        onNewPurchase={() => {
          if (!isPremium && purchases.length >= FREE_TRIES) {
            setPaywallReason(`Free plan includes ${FREE_TRIES} check-ins a month — you've used them all. Upgrade for unlimited check-ins.`);
            return;
          }
          setView("newPurchase");
        }}
        onResolveWait={handleResolveWait}
        onOpenFeed={() => setView("publicFeed")}
        onOpenGoalCelebration={handleOpenGoalCelebration}
        onOpenGroupGoalCelebration={handleOpenGroupGoalCelebration}
        onNewGroupGoal={() => {
          if (!isPremium && groupGoals.filter((g) => !g.archived).length >= 1) {
            setPaywallReason("Free plan includes 1 group goal at a time. Upgrade to start more collaborations.");
            return;
          }
          setView("newGroupGoal");
        }}
        onOpenGroupGoal={(id) => { setSelectedGroupGoalId(id); setView("groupGoalDetail"); }}
        onNewGoal={() => {
          if (!isPremium && profile.goals.filter((g) => !g.archived).length >= 1) {
            setPaywallReason("Free plan includes 1 personal goal at a time. Upgrade to track more goals side by side.");
            return;
          }
          setView("newGoal");
        }}
        onAddFunds={(id) => { setSelectedGoalId(id); setView("addFunds"); }}
        onLogSpending={() => setView("logSpending")}
        onReviewMonth={() => {
          if (!isPremium && (profile.monthlyReviewsUsed || 0) >= 1) {
            setPaywallReason("Free plan includes 1 monthly AI review. Upgrade for a fresh review every month.");
            return;
          }
          handleUseMonthlyReview();
        }}
        onUpgrade={() => setPaywallReason("Unlock everything — unlimited goals, unlimited check-ins, and more.")}
        onOpenSettings={() => setView("settings")}
        onRegretFeedback={handleRegretFeedback}
      />
      {activeTip && <FinancialTipModal tip={activeTip} companion={profile.companion} onClose={() => setActiveTip(null)} />}
      {paywallReason && <PaywallModal reason={paywallReason} onUpgrade={handleUpgrade} onClose={() => setPaywallReason(null)} checkingOut={checkingOut} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TalkMeOutOfIt />);
</script>
</body>
</html>
