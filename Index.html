     overlap or push things off-screen — especially on narrow phone

     so every input/button actually shrinks to fit its row like any
     other flex child does. */
  input, textarea, select, button { min-width: 0; }

     content clips instead of spilling past the screen edge. */

.tmooi-land{background:${COLORS.bg};min-height:100vh;color:${COLORS.ink};font-family:'Inter',-apple-system,sans-serif;background-image:radial-gradient(560px 380px at 82% -6%, rgba(205,168,85,0.14), transparent 60%),radial-gradient(480px 360px at 8% 18%, rgba(139,127,216,0.10), transparent 60%);background-repeat:no-repeat;overflow-x:hidden;width:100%;box-sizing:border-box;}

.tmooi-land-nav{display:flex;align-items:center;justify-content:space-between;padding:26px 0;}
.tmooi-land-brand{display:flex;align-items:center;gap:10px;font-family:'Newsreader',serif;font-size:17.5px;font-weight:600;}
.tmooi-land-mark{width:30px;height:30px;border-radius:50%;background:${COLORS.goldGrad};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 6px 18px -6px rgba(205,168,85,0.55);}
.tmooi-land-navlinks{display:flex;align-items:center;gap:18px;}
.tmooi-land-navlink{font-size:13.5px;color:${COLORS.inkSoft};cursor:pointer;background:none;border:none;font-family:inherit;transition:color .15s ease;}
.tmooi-land-navlink:hover{color:${COLORS.honey};text-decoration:underline;}
.tmooi-land-cta{font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:8px;border:1px solid ${COLORS.line};color:${COLORS.ink};background:rgba(255,255,255,0.03);cursor:pointer;font-family:inherit;}
.tmooi-land-hero{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding:40px 0 68px;}
.tmooi-land-cta-btn-wrap{display:inline-block;}
.tmooi-land-hero-copy{max-width:480px;}

}

function landingVerdictFor(price) {
  if (isNaN(price)) price = 40;
  if (price < 30) return "worth";
  if (price < 120) return "wait";
  return "skip";
}

function LandingHeroHook() {
  const [i, setI] = useState(0);
  const [visible, setVisible] = useState(true);
  const done = i >= LANDING_HOOK_LINES.length;
  useEffect(() => {
    if (done) return;
    const outTimer = setTimeout(() => setVisible(false), 1900);
    const swapTimer = setTimeout(() => { setI((v) => v + 1); setVisible(true); }, 2350);
    return () => { clearTimeout(outTimer); clearTimeout(swapTimer); };
  }, [i, done]);
  const text = done ? LANDING_HOOK_FINAL : LANDING_HOOK_LINES[i];
  return React.createElement("h1", {
    className: "tmooi-land-h1 tmooi-hook" + (done ? " tmooi-hook-final" : ""),
    style: { opacity: visible ? 1 : 0, transform: visible ? "translateY(0)" : "translateY(-6px)" },
  }, text);
}

hing tempts you."},{label:"I always buy same-day",feedback:"No judgment \u2014 that's exactly what this app's WAIT verdict is built to interrupt."}]}},{emoji:"\u{1FAD9}",title:"Pay yourself first",body:"Move money to savings the moment you're paid, before it has a chance to get spent elsewhere. Even $10 a paycheck builds the habit \u2014 the amount matters less than the reflex.",reflection:{question:"Do you save before or after you spend?",options:[{label:"Before",feedback:"You're already doing the hard part."},{label:"After, if anything's left",feedback:"Try flipping the order next paycheck."},{label:"I don't have a system yet",feedback:"Even $5 automated on payday builds the habit."}]}},{emoji:"\u{1F501}",title:"Audit your subscriptions",body:"The average person forgets about at least one recurring subscription. Once a quarter, scan your statements for anything you're paying for but not using.",reflection:{question:"How many subscriptions do you think you're paying for right now?",options:[{label:"I know exactly",feedback:"Nice \u2014 that's rarer than you'd think."},{label:"Roughly, not exactly",feedback:"A 5-minute statement scan might surprise you."},{label:"Honestly no idea",feedback:"You're not alone \u2014 that's exactly why this tip exists."}]}},{emoji:"\u{1F4CA}",title:"Try the 50/30/20 split",body:"A simple starting budget: 50% needs, 30% wants, 20% savings/debt paydown. It's a rough guide, not a rule \u2014 adjust it to fit your actual life.",reflection:{question:"Which chunk of your spending feels hardest to control?",options:[{label:"Needs",feedback:'Worth checking if any "needs" have crept into "wants."'},{label:"Wants",feedback:"That's usually the flexible one \u2014 small trims add up."},{label:"Savings",feedback:"Automating it removes the willpower requirement."}]}},{emoji:"\u{1F422}",title:"Small amounts compound",body:"Saving $5/day is $1,825/year. Consistency beats intensity \u2014 a small habit you actually keep beats an ambitious plan you abandon in week two.",reflection:{question:"Could you find $5 a day somewhere without feeling it?",options:[{label:"Easily",feedback:"That's $1,825 a year \u2014 go set it up."},{label:"Maybe",feedback:"Even a smaller number counts if it's consistent."},{label:"Not right now",feedback:"That's okay \u2014 the habit matters more than the amount."}]}},{emoji:"\u{1F3AF}",title:"Name your goals",body:'A goal called "Savings" is easy to raid. A goal called "Miami Trip \u2014 June" or "Emergency Fund" is harder to justify spending from. Specificity creates friction, on purpose.',reflection:{question:'Do your savings goals have real names, or just "Savings"?',options:[{label:"They're named",feedback:"That's part of why they stick."},{label:'Just "Savings"',feedback:"Try renaming one \u2014 it changes how it feels to spend from it."},{label:"I don't have one yet",feedback:"Starting one with a name is a good first move."}]}},{emoji:"\u{1F6D1}",title:"Watch for lifestyle creep",body:"When income goes up, spending quietly rising to match it is normal \u2014 but it means raises never actually build savings. Redirect part of any raise straight to a goal before you get used to having it.",reflection:{question:"When you last got a raise, where did the extra money go?",options:[{label:"Mostly savings",feedback:"That's the move \u2014 most people don't do that."},{label:"I'm honestly not sure",feedback:"Worth tracing next time it happens."},{label:"It just got absorbed",feedback:"Very normal \u2014 redirecting even half of the next one helps."}]}},{emoji:"\u{1F9FE}",title:"Cost-per-use is the real price",body:"A $120 item you use 100 times costs $1.20 a use. A $20 item you use once costs $20 a use. Price tag and true cost aren't the same thing.",reflection:{question:"Think of something you own \u2014 was it worth the price per use?",options:[{label:"Definitely",feedback:"That's a good buy, even if it was expensive."},{label:"Not really",feedback:"That's useful data for next time."},{labe
