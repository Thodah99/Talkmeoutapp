const { useState, useEffect } = React;

/* ---------------------------------------------------------------

];

const GROUP_TYPES = [

  { id: "birthday", emoji: "🎂", label: "Birthday" },
  { id: "wedding", emoji: "💍", label: "Wedding" },
  { id: "concert", emoji: "🎤", label: "Concert" },
  { id: "event", emoji: "🎉", label: "Event" },
  { id: "group_gift", emoji: "🎁", label: "Group gift" },
  { id: "emergency", emoji: "🆘", label: "Emergency" },
  { id: "custom", emoji: "➕", label: "Custom" },
];

const FREQUENCIES = [
  { id: "weekly", label: "Weekly", days: 7 },
  { id: "biweekly", label: "Every 2 weeks", days: 14 },
  { id: "monthly", label: "Monthly", days: 30 },
  { id: "custom", label: "Custom", days: null },
];

/* ---------------------------------------------------------------
   GROUP GOAL SCHEDULE GENERATOR
   Builds an installment schedule of {dueDate, amount, completed}
   between now and the target date, spaced by the chosen frequency.
----------------------------------------------------------------*/
function countInstallments(startDate, targetDate, intervalDays) {
  let count = 0;
  let cursor = new Date(startDate);
  while (true) {
    cursor = new Date(cursor.getTime() + intervalDays * 86400000);
    if (cursor > targetDate) break;
    count++;
    if (count > 200) break; // safety cap
  }
  return Math.max(count, 1);
}

function generateSchedule(targetAmount, targetDateStr, intervalDays, startDate = new Date()) {
  const targetDate = new Date(targetDateStr);
  const count = countInstallments(startDate, targetDate, intervalDays);
  const base = Math.floor((targetAmount / count) * 100) / 100;
  const schedule = [];
  let cursor = new Date(startDate);
  let allocated = 0;
  for (let i = 0; i < count; i++) {
    cursor = new Date(cursor.getTime() + intervalDays * 86400000);
    const isLast = i === count - 1;
    const amount = isLast ? Math.round((targetAmount - allocated) * 100) / 100 : base;
    allocated += amount;
    schedule.push({ dueDate: cursor.toISOString().slice(0, 10), amount, completed: false });
  }
  return schedule;
}

function formatDueDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// Local calendar date as "YYYY-MM-DD" — used to tell whether today counts
// as a new distinct day of app use, independent of how many times the
// page gets reloaded within that same day.
function todayLocalStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Consecutive most-recent purchases where the person respected the verdict
// (didn't override it with "buy it anyway"). Resets the moment they do.
function computeStreak(purchases) {
  let streak = 0;
  for (const p of purchases) {
    if (p.outcome === "bought_anyway") break;
    streak++;
  }
  return streak;
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Consecutive calendar days (up to today) on which the person logged
// something — a purchase check-in or a spending entry. Grace of one day:
// if they haven't logged yet today, yesterday's activity still keeps the
// streak alive so it doesn't reset the instant the clock rolls over.
function computeDayStreak(purchases, spendingLog) {
  const days = new Set();
  (purchases || []).forEach((p) => { if (p.createdAt) days.add(dateKey(new Date(p.createdAt))); });
  (spendingLog || []).forEach((e) => { if (e.date) days.add(e.date); });
  if (days.size === 0) return 0;

  const cursor = new Date();
  if (!days.has(dateKey(cursor))) {
    cursor.setDate(cursor.getDate() - 1);
    if (!days.has(dateKey(cursor))) return 0;
  }
  let streak = 0;
  while (days.has(dateKey(cursor))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

// Looks at the last few check-ins to see if a trigger keeps repeating —
// used to give the companion something real to reflect back, not just a verdict.
function getRecentPatterns(purchases) {
  const recent = purchases.slice(0, 8);
  if (recent.length < 2) return null;
  const triggerCounts = {};
  let needCount = 0, wantCount = 0;
  recent.forEach((p) => {
    if (p.trigger) triggerCounts[p.trigger] = (triggerCounts[p.trigger] || 0) + 1;
    if (p.needOrWant === "need") needCount++;
    else if (p.needOrWant === "want") wantCount++;
  });
  const impulseTriggers = ["sale", "social_media", "trend", "boredom", "stress"];
  let topTrigger = null, topCount = 0;
  Object.entries(triggerCounts).forEach(([t, c]) => { if (c > topCount) { topTrigger = t; topCount = c; } });
  const isImpulsePattern = !!topTrigger && impulseTriggers.includes(topTrigger) && topCount >= 2;
  return { recentCount: recent.length, topTrigger, topCount, isImpulsePattern, needCount, wantCount };
}

// Real, in-app reminders — "your contribution is due" / "you haven't
// checked in in a while" — computed fresh from actual data every time the
// dashboard loads. No push infrastructure needed for this part; it's what
// shows up the moment the person opens the app.
function computeReminders(profile, purchases, groupGoals, uid) {
  const reminders = [];
  const prefs = profile.notificationPrefs || { contributionReminders: true, inactivityReminders: true };
  const now = Date.now();
  const DAY = 86400000;

  if (prefs.inactivityReminders) {
    const lastCheckIn = purchases[0]?.createdAt || null;
    if (lastCheckIn) {
      const daysSince = Math.floor((now - lastCheckIn) / DAY);
      if (daysSince >= 7) {
        reminders.push({
          id: "inactivity",
          icon: "👋",
          text: `It's been ${daysSince} days since your last check-in — anything you're thinking about buying?`,
        });
      }
    }
  }

  if (prefs.contributionReminders) {
    (groupGoals || []).filter((g) => !g.archived).forEach((g) => {
      const me = g.participants.find((p) => p.uid === uid);
      if (!me) return;
      const upcoming = me.schedule.find((c) => {
        if (c.completed) return false;
        const daysUntil = (new Date(c.dueDate).getTime() - now) / DAY;
        return daysUntil <= 3; // due within 3 days, or already overdue
      });
      if (upcoming) {
        const overdue = new Date(upcoming.dueDate).getTime() < now;
        reminders.push({
          id: `contrib-${g.id}`,
          icon: overdue ? "⚠️" : "⏳",
          text: overdue
            ? `Your $${upcoming.amount} contribution for "${g.name}" was due ${formatDueDate(upcoming.dueDate)} — log it when you get a chance.`
            : `Your $${upcoming.amount} contribution for "${g.name}" is due ${formatDueDate(upcoming.dueDate)}.`,
        });
      }
    });
  }

  return reminders;
}

// Finds the single oldest purchase that's due for a "still feel good about
// that?" follow-up — only for WAIT-verdict purchases with a resolved
// outcome, and only one at a time so it doesn't pile up on the dashboard.
function getDueRegretCheck(purchases) {
  const now = Date.now();
  const due = purchases.filter((p) =>
    p.decision?.recommendation === "WAIT" &&
    !p.regretFeedback &&
    p.regretCheckDate &&
    p.regretCheckDate <= now &&
    p.outcome !== "waiting"
  );
  if (due.length === 0) return null;
  return due.sort((a, b) => a.regretCheckDate - b.regretCheckDate)[0];
}

/* ---------------------------------------------------------------
   DECISION ENGINE — deterministic, no AI involved
----------------------------------------------------------------*/
// Looks back at past WAIT-verdict purchases where the person answered the
// "still feel good about that?" follow-up, split by which way they went —
// bought after waiting, or skipped after waiting. This is the one signal
// that reflects whether the app's own advice actually worked out for them,
// not just what they said about themselves at onboarding.
function getRegretSignal(purchases) {
  let boughtGlad = 0, boughtRegret = 0, skippedGlad = 0, skippedRegret = 0;
  purchases.forEach((p) => {
    if (p.decision?.recommendation !== "WAIT" || !p.regretFeedback) return;
    const endedBuying = p.outcome === "bought_anyway" || p.waitOutcome === "bought";
    const endedSkipping = p.outcome === "skipped" || p.waitOutcome === "abandoned";
    if (endedBuying) {
      if (p.regretFeedback === "glad") boughtGlad++;
      else if (p.regretFeedback === "regret") boughtRegret++;
    } else if (endedSkipping) {
      if (p.regretFeedback === "glad") skippedGlad++;
      else if (p.regretFeedback === "regret") skippedRegret++;
    }
  });
  return { boughtGlad, boughtRegret, skippedGlad, skippedRegret };
}

// Turns the same regret signal that quietly adjusts scoring into something
// visible — surfacing "here's what's actually working for you" instead of
// leaving the personalization invisible and easy to not notice.
function getPatternInsight(purchases) {
  const { boughtGlad, boughtRegret, skippedGlad, skippedRegret } = getRegretSignal(purchases);
  const total = boughtGlad + boughtRegret + skippedGlad + skippedRegret;
  if (total < 2) return { ready: false, total };
  const gladTotal = boughtGlad + skippedGlad;
  let leaning = null;
  if (boughtRegret >= 2 && boughtRegret > boughtGlad) leaning = "skip";
  else if (skippedRegret >= 2 && skippedRegret > skippedGlad) leaning = "worth_it";
  return { ready: true, gladTotal, total, leaning };
}

function runDecisionEngine(purchase, spendingProfile, goal, regretSignal) {
  let score = 0;
  const factors = [];

  if (purchase.needOrWant === "need") { score += 30; factors.push("It's a genuine need"); }
  else if (purchase.needOrWant === "not_sure") { score += 10; }

  if (purchase.fullPrice === "yes") { score += 15; factors.push("You'd buy it at full price"); }
  else if (purchase.fullPrice === "maybe") { score += 5; }
  else if (purchase.fullPrice === "no") { score -= 15; factors.push("You wouldn't pay full price for it"); }

  if (purchase.ownsSimilar) { score -= 15; factors.push("You already own something similar"); }

  const usageInfo = USAGE.find((u) => u.id === purchase.usage) || USAGE[2];
  if (["frequently", "weekly"].includes(purchase.usage)) { score += 20; factors.push("You'd use it often"); }
  else if (purchase.usage === "sometimes") { score += 10; }
  else if (purchase.usage === "rarely") { score -= 10; factors.push("You'd rarely use it"); }
  else if (purchase.usage === "once") { score -= 20; factors.push("You'd likely use it once"); }

  if (purchase.trigger === "genuine_need") { score += 15; }
  else if (purchase.trigger === "reward") { score += 5; }
  else if (["sale", "trend", "social_media", "boredom", "stress"].includes(purchase.trigger)) {
    score -= 10;
    factors.push(`The trigger was ${TRIGGERS.find((t) => t.id === purchase.trigger)?.label.toLowerCase()}, not need`);
  }

  let goalImpactAmount = null;
  let goalImpactPercent = null;
  if (goal) {
    goalImpactAmount = purchase.price;
    goalImpactPercent = (purchase.price / goal.targetAmount) * 100;
    if (goalImpactPercent > 15) { score -= 20; factors.push(`It'd eat ${goalImpactPercent.toFixed(0)}% of your ${goal.name} goal`); }
    else if (goalImpactPercent >= 5) { score -= 10; factors.push(`It'd take a real bite out of ${goal.name}`); }
  }

  if (spendingProfile?.impulseShopper && ["sale", "social_media", "trend", "boredom", "stress"].includes(purchase.trigger)) {
    score -= 10;
    factors.push("This matches your impulse-shopping pattern");
  }
  if (spendingProfile?.regretFrequency === "often") { score -= 10; }

  if (purchase.wantScore >= 8) { score += 10; }
  else if (purchase.wantScore <= 3) { score -= 10; }

  // Real-outcome learning: only kicks in once there's enough signal (2+
  // answers leaning one way) to mean something, not a single data point.
  if (regretSignal) {
    const { boughtGlad, boughtRegret, skippedGlad, skippedRegret } = regretSignal;
    if (boughtRegret >= 2 && boughtRegret > boughtGlad) {
      score -= 5;
      factors.push("Waiting-then-buying hasn't tended to sit well with you");
    }
    if (skippedRegret >= 2 && skippedRegret > skippedGlad) {
      score += 5;
      factors.push("You've tended to regret skipping things like this");
    }
  }

  let recommendation = "WAIT";
  if (score >= 25) recommendation = "WORTH_IT";
  else if (score < 0) recommendation = "SKIP";

  const costPerUse = purchase.price / usageInfo.uses;

  return { recommendation, score, costPerUse, goalImpactAmount, goalImpactPercent, factors };
}

----------------------------------------------------------------*/
// Shrinks a photo to a small JPEG data URL so a post comfortably fits
// in a single Firestore doc (1MB doc limit) without needing Storage.
function resizeImageToDataUrl(file, maxDim = 900, quality = 0.6) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Claims an existing unclaimed name slot (or adds a brand new participant)
// for the joining uid, using a transaction so two people accepting the
// same invite at once can't both grab the same slot.
async function joinGroupGoal(groupGoalId, uid, { claimParticipantId, newName, reminderDay }) {
  const ref = db.collection("groupGoals").doc(groupGoalId);
  try {
    await db.runTransaction(async (tx) => {
      const doc = await tx.get(ref);
      if (!doc.exists) throw new Error("Group goal not found");
      const g = doc.data();
      if ((g.memberUids || []).includes(uid)) return; // already a member, no-op
      let participants;
      if (claimParticipantId) {
        participants = g.participants.map((p) => p.id === claimParticipantId && !p.uid ? { ...p, uid, reminderDay } : p);
      } else {
        const equalShare = Math.round((g.targetAmount / (g.participants.length + 1)) * 100) / 100;
        participants = [...g.participants, {
          id: `participant-${Date.now()}`, name: newName || "New member", uid,
          allocatedAmount: equalShare, schedule: generateSchedule(equalShare, g.targetDate, g.intervalDays), reminderDay,
        }];
      }
      tx.update(ref, { participants, memberUids: firebase.firestore.FieldValue.arrayUnion(uid) });
    });
    const fresh = await ref.get();
    return fresh.exists ? fresh.data() : null;
  } catch (e) { console.error("joinGroupGoal failed:", e); return null; }
}

// Small "listen" button using the browser's built-in text-to-speech —
// no AI call needed, just reads whatever text it's given out loud, at a
// normal, clean pace.
function SpeakButton({ text, voiceName }) {
  const [speaking, setSpeaking] = useState(false);

  useEffect(() => {
    return () => { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch {} };
  }, []);

  const toggleSpeak = () => {
    if (!window.speechSynthesis || !text) return;
    if (speaking) {
      window.speechSynthesis.cancel();
      setSpeaking(false);
      return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    if (voiceName) {
      const match = window.speechSynthesis.getVoices().find((v) => v.name === voiceName);
      if (match) utterance.voice = match;
    }
    utterance.onend = () => setSpeaking(false);
    utterance.onerror = () => setSpeaking(false);
    setSpeaking(true);
    window.speechSynthesis.speak(utterance);
  };

  if (!text) return null;

  return (
    <button onClick={toggleSpeak} aria-label={speaking ? "Stop reading aloud" : "Listen to this"}
      style={{
        display: "inline-flex", alignItems: "center", justifyContent: "center",
        width: 32, height: 32, borderRadius: "50%", border: "none", cursor: "pointer",
        background: speaking ? COLORS.periwinkle : "rgba(255,255,255,0.10)",
        color: speaking ? COLORS.onGold : COLORS.periwinkle, fontSize: 12, flexShrink: 0,
      }}>
      {speaking ? "⏸" : "🔊"}
    </button>
  );
}

function AuthScreen() {
  const [mode, setMode] = useState("signup"); // signup | login
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);

  const submit = async () => {
    setError("");
    setResetSent(false);
    if (!email.trim() || !password) { setError("Enter an email and password."); return; }
    if (password.length < 6) { setError("Password needs to be at least 6 characters."); return; }
    setBusy(true);
    try {
      if (mode === "signup") {
        await auth.createUserWithEmailAndPassword(email.trim(), password);
      } else {
        await auth.signInWithEmailAndPassword(email.trim(), password);
      }
      // onAuthStateChanged in the root component picks it up from here.
    } catch (e) {
      setError(e.message.replace("Firebase: ", "").replace(/\s*\(auth\/[^)]+\)\.?/, ""));
      setBusy(false);
    }
  };

  const handleForgotPassword = async () => {
    setError("");
    setResetSent(false);
    if (!email.trim()) { setError("Enter your email above first, then tap this again."); return; }
    setBusy(true);
    try {
      await auth.sendPasswordResetEmail(email.trim());
      setResetSent(true);
    } catch (e) {
      setError(e.message.replace("Firebase: ", "").replace(/\s*\(auth\/[^)]+\)\.?/, ""));
    }
    setBusy(false);
  };

  return (
    <Shell>
      <div style={{ textAlign: "center", paddingTop: 56, marginBottom: 24 }}>
        <div style={{
          width: 74, height: 74, borderRadius: "50%", margin: "0 auto 22px", background: COLORS.goldGrad,
          display: "flex", alignItems: "center", justifyContent: "center", fontSize: 30,
          boxShadow: "0 0 0 1px rgba(205,168,85,0.25), 0 20px 45px -14px rgba(205,168,85,0.7)",
        }}>💬</div>
        <h1 className="tmooi-display" style={{ fontSize: 30, fontWeight: 700, color: COLORS.ink, marginBottom: 8 }}>
          {mode === "signup" ? "Create your account" : "Welcome back"}
        </h1>
        <p style={{ color: COLORS.inkSoft, fontSize: 14 }}>
          {mode === "signup" ? "Your goals and check-ins sync to this account." : "Log in to pick up where you left off."}
        </p>
      </div>

      <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" type="email" style={inputStyle} autoCapitalize="none" />
      <input value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Password" type="password" style={{ ...inputStyle, marginTop: 10 }} />

      {mode === "login" && (
        <button onClick={handleForgotPassword} disabled={busy}
          style={{ marginTop: 10, background: "none", border: "none", color: COLORS.inkSoft, fontSize: 12.5, cursor: busy ? "default" : "pointer", padding: 0 }}>
          Forgot password?
        </button>
      )}

      {resetSent && (
        <div style={{ marginTop: 12, fontSize: 13, color: COLORS.grass, background: COLORS.grassSoft, borderRadius: 10, padding: "10px 12px" }}>
          Check your email for a reset link.
        </div>
      )}

      {error && (
        <div style={{ marginTop: 12, fontSize: 13, color: COLORS.coral, background: COLORS.coralSoft, borderRadius: 10, padding: "10px 12px" }}>
          {error}
        </div>
      )}

      <div style={{ marginTop: 18 }}>
        <PrimaryButton onClick={submit} disabled={busy}>
          {busy ? "One sec..." : mode === "signup" ? <React.Fragment>Create account {ICON.arrowRight}</React.Fragment> : <React.Fragment>Log in {ICON.arrowRight}</React.Fragment>}
        </PrimaryButton>
      </div>

      <button onClick={() => { setMode(mode === "signup" ? "login" : "signup"); setError(""); setResetSent(false); }}
        style={{ marginTop: 16, width: "100%", background: "none", border: "none", color: COLORS.periwinkle, fontSize: 13.5, fontWeight: 600, cursor: "pointer" }}>
        {mode === "signup" ? "Already have an account? Log in" : "New here? Create an account"}
      </button>
    </Shell>
  );
}

// A single row in the "On wait" card. Items posted to Phone a Friend get
// a live vote tally in place of the generic "Still want it?" prompt — this
// is where the *poster* (not the crowd) sees their own results, separate
// from the public feed people browse to vote on others' items.
function OnWaitRow({ purchase, onResolveWait }) {
  const [feedPost, setFeedPost] = useState(null);
  useEffect(() => {
    if (purchase.feedPostId) fetchMyFeedPost(purchase.feedPostId).then(setFeedPost);
  }, [purchase.feedPostId]);

  const totalVotes = feedPost ? feedPost.votes.hit + feedPost.votes.skip : 0;
  const label = !purchase.feedPostId
    ? <React.Fragment>Still want it? {ICON.arrowRight}</React.Fragment>
    : totalVotes === 0
    ? <React.Fragment>📞 Waiting on the jury</React.Fragment>
    : <React.Fragment>📞 {totalVotes} on the stand {ICON.arrowRight}</React.Fragment>;

  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderTop: `1px solid ${COLORS.line}` }}>
      <div>
        <div style={{ fontSize: 14, fontWeight: 600, color: COLORS.ink }}>{purchase.itemName}</div>
        <div className="tmooi-mono" style={{ fontSize: 12, color: COLORS.inkSoft }}>${purchase.price}</div>
      </div>
      <button onClick={() => onResolveWait(purchase.id)} style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.periwinkle, background: "none", border: "none", cursor: "pointer" }}>
        {label}
      </button>
    </div>
  );
}

      <button onClick={onNewPurchase} className="tmooi-shine" style={{
        width: "100%", background: COLORS.goldGrad, borderRadius: 18, padding: "22px 20px",
        border: "none", cursor: "pointer", textAlign: "left", display: "flex", alignItems: "center", justifyContent: "space-between",
        boxShadow: "0 16px 40px -14px rgba(205,168,85,0.65)",
      }}>
        <div>
          <div className="tmooi-display" style={{ color: COLORS.onGold, fontSize: 20, fontWeight: 700 }}>Talk Me Out Of It</div>
          <div style={{ color: "rgba(33,23,5,0.65)", fontSize: 12.5, marginTop: 3, fontWeight: 500 }}>Thinking about buying something?</div>
        </div>
        <div style={{ width: 38, height: 38, borderRadius: 10, background: "rgba(33,23,5,0.14)", display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.onGold, fontSize: 20 }}>
          {ICON.chevronRight}
        </div>
      </button>

      <div style={{ display: "flex", gap: 10, marginTop: 12, marginBottom: 18 }}>
        <div style={{ ...cardStyle, flex: 1, display: "flex", alignItems: "center", gap: 10, padding: "12px 14px" }}>
          <span style={{ fontSize: 16 }}>{ICON.wallet}</span>
          <div>
            <div style={{ fontSize: 11, color: COLORS.inkSoft }}>Saved so far</div>
            <div className="tmooi-mono" style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink }}>${profile.avoidedSpending}</div>
          </div>
        </div>
        {/* Second stat slot is dynamic, not stacked — only one of these
            ever shows, so the dashboard stays two tiles wide. Something
            to judge on the feed takes priority (it's time-sensitive and
            the whole point of the feed dying without eyes on it); short
            of that, fall back to whichever streak is actually running. */}
        {feedVoteCount > 0 ? (
          <button onClick={onOpenFeed} style={{ ...cardStyle, flex: 1, display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", border: `1.5px solid ${COLORS.periwinkle}`, cursor: "pointer", textAlign: "left" }}>
            <span style={{ fontSize: 16 }}>📞</span>
            <div>
              <div style={{ fontSize: 11, color: COLORS.inkSoft }}>Phone a Friend</div>
              <div className="tmooi-mono" style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink }}>{feedVoteCount} on the stand</div>
            </div>
          </button>
        ) : streak > 0 ? (
          <div style={{ ...cardStyle, flex: 1, display: "flex", alignItems: "center", gap: 10, padding: "12px 14px" }}>
            <span style={{ fontSize: 16 }}>🔥</span>
            <div>
              <div style={{ fontSize: 11, color: COLORS.inkSoft }}>Streak</div>
              <div className="tmooi-mono" style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink }}>{streak}</div>
            </div>
          </div>
        ) : dayStreak > 0 && (
          <div style={{ ...cardStyle, flex: 1, display: "flex", alignItems: "center", gap: 10, padding: "12px 14px" }}>
            <span style={{ fontSize: 16 }}>📅</span>
            <div>
              <div style={{ fontSize: 11, color: COLORS.inkSoft }}>Day streak</div>
              <div className="tmooi-mono" style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink }}>{dayStreak}</div>
            </div>
          </div>
        )}
      </div>

      {alertCount > 0 && (
        <button onClick={() => setShowAlerts(!showAlerts)}
          style={{
            display: "flex", alignItems: "center", gap: 8, width: "100%", boxSizing: "border-box",
            marginBottom: showAlerts ? 10 : 18, padding: "10px 14px", borderRadius: 12, cursor: "pointer",
            background: COLORS.periwinkleSoft, border: "none", textAlign: "left",
          }}>
          <span style={{ fontSize: 15 }}>🔔</span>
          <span style={{ flex: 1, fontSize: 13, fontWeight: 600, color: COLORS.ink }}>
            {alertCount} update{alertCount > 1 ? "s" : ""}
          </span>
          <span style={{ fontSize: 11, color: COLORS.periwinkle, fontWeight: 700 }}>{showAlerts ? "Hide ▲" : "Show ▼"}</span>
        </button>
      )}

      {showAlerts && (
        <React.Fragment>
          {regretCheck && (
            <div style={{ marginBottom: 10, background: COLORS.honeySoft, borderRadius: 12, padding: "14px 16px" }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 10 }}>
                <span style={{ fontSize: 16 }}>🤔</span>
                <span style={{ flex: 1, fontSize: 13, color: COLORS.ink, lineHeight: 1.4 }}>
                  {endedBuying
                    ? `A couple weeks ago you waited, then got "${regretCheck.itemName}" anyway. Any regrets, or glad you did?`
                    : `A couple weeks ago you waited, then skipped "${regretCheck.itemName}". Still feel good about that?`}
                </span>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => onRegretFeedback(regretCheck.id, "glad")}
                  style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", background: COLORS.grassSoft, color: COLORS.grass, fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
                  👍 {endedBuying ? "Glad I got it" : "Glad I skipped it"}
                </button>
                <button onClick={() => onRegretFeedback(regretCheck.id, "regret")}
                  style={{ flex: 1, padding: "9px", borderRadius: 10, border: "none", background: COLORS.coralSoft, color: COLORS.coral, fontWeight: 600, fontSize: 12.5, cursor: "pointer" }}>
                  👎 {endedBuying ? "Wish I hadn't" : "Wish I'd gotten it"}
                </button>
              </div>
            </div>
          )}

          {reminders.map((r) => (
            <div key={r.id} style={{ display: "flex", alignItems: "flex-start", gap: 10, marginBottom: 10, background: COLORS.periwinkleSoft, borderRadius: 12, padding: "12px 14px" }}>
              <span style={{ fontSize: 16 }}>{r.icon}</span>
              <span style={{ flex: 1, fontSize: 13, color: COLORS.ink, lineHeight: 1.4 }}>{r.text}</span>
              <button onClick={() => setDismissedReminders([...dismissedReminders, r.id])}
                style={{ background: "none", border: "none", color: COLORS.inkSoft, fontSize: 13, cursor: "pointer", padding: "0 0 0 6px", lineHeight: 1 }}>
                {ICON.x}
              </button>
            </div>
          ))}

          {patternInsight.total >= 1 && (
            <div style={{ marginBottom: 10, background: COLORS.periwinkleSoft, borderRadius: 12, padding: "12px 14px" }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
                <span style={{ fontSize: 16 }}>🧭</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.periwinkle, textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 3 }}>Pattern insight</div>
                  {!patternInsight.ready ? (
                    <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.4 }}>
                      Answer a couple more "still feel good about that?" check-ins and I'll start showing you what's actually working.
                    </div>
                  ) : (
                    <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.45 }}>
                      WAIT has worked out for you <span className="tmooi-mono" style={{ fontWeight: 700 }}>{patternInsight.gladTotal} of {patternInsight.total}</span> times.
                      {patternInsight.leaning === "skip" && " You've tended to regret buying after waiting — so I'm leaning a little more toward SKIP on close calls now."}
                      {patternInsight.leaning === "worth_it" && " You've tended to regret skipping more than buying — so I'm leaning a little more toward WORTH IT on close calls now."}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
          <div style={{ marginBottom: 12 }} />
        </React.Fragment>
      )}

      {/* Personal goals */}
      <div style={{ marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>My Goals</span>
        <button onClick={onNewGoal} style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.periwinkle, background: "none", border: "none", cursor: "pointer" }}>+ New goal</button>
      </div>
      {(() => {
        const activeGoals = profile.goals.filter((g) => !g.archived);
        // Lead with whichever goal is closest to done — that's the one worth seeing first.
        const sorted = [...activeGoals].sort((a, b) =>
          (b.currentAmount / b.targetAmount || 0) - (a.currentAmount / a.targetAmount || 0));
        const visible = showAllGoals ? sorted : sorted.slice(0, 1);
        return visible;
      })().map((goal) => {
        const pct = Math.min(100, Math.round((goal.currentAmount / goal.targetAmount) * 100));
        const isMet = goal.currentAmount >= goal.targetAmount;
        const needsCelebration = isMet && !goal.celebrated;

        if (needsCelebration) {
          return (
            <button key={goal.id} onClick={() => onOpenGoalCelebration(goal.id)} className="tmooi-shine"
              style={{
                width: "100%", textAlign: "left", cursor: "pointer", marginBottom: 10, display: "block",
                borderRadius: 18, padding: "18px", border: "none", background: COLORS.goldGrad,
                boxShadow: "0 12px 30px -10px rgba(205,168,85,0.6)", position: "relative", overflow: "hidden",
              }}>
              {["🎉", "✨", "🎊"].map((e, i) => (
                <span key={i} style={{ position: "absolute", left: `${20 + i * 30}%`, top: -14, fontSize: 16, animation: `confettiFall ${1.8 + i * 0.3}s ease-in ${i * 0.15}s infinite` }}>{e}</span>
              ))}
              <div style={{ fontSize: 11, fontWeight: 700, color: "rgba(33,23,5,0.7)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 4 }}>Goal met 🎉</div>
              <div className="tmooi-display" style={{ fontSize: 19, fontWeight: 700, color: COLORS.onGold, marginBottom: 4 }}>Congratulations — {goal.name}!</div>
              <div style={{ fontSize: 12.5, color: "rgba(33,23,5,0.75)" }}>${goal.currentAmount} saved · tap to celebrate</div>
            </button>
          );
        }

        return (
          <div key={goal.id} style={{ ...cardStyle, marginBottom: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
              <span>{GOAL_CATEGORIES.find((g) => g.id === goal.category)?.emoji || ICON.target}</span>
              <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>{goal.name}</span>
            </div>
            <div className="tmooi-mono" style={{ fontSize: 22, fontWeight: 600, color: COLORS.ink, marginBottom: 10 }}>
              ${goal.currentAmount} <span style={{ color: COLORS.inkSoft, fontWeight: 400, fontSize: 15 }}>/ ${goal.targetAmount}</span>
            </div>
            <div style={{ height: 8, borderRadius: 8, background: COLORS.line, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${pct}%`, background: COLORS.goldGrad, borderRadius: 8, transition: "width 0.4s ease" }} />
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
              <span style={{ fontSize: 12, color: COLORS.inkSoft }}>{pct}% there · ${Math.max(0, goal.targetAmount - goal.currentAmount)} to go</span>
              <button onClick={() => onAddFunds(goal.id)} style={{ fontSize: 12, fontWeight: 600, color: COLORS.periwinkle, background: "none", border: "none", cursor: "pointer" }}>+ Add funds</button>
            </div>
            {goal.catchUpPlan && (
              <div style={{ marginTop: 10, fontSize: 11.5, color: COLORS.periwinkle, background: COLORS.periwinkleSoft, borderRadius: 8, padding: "7px 10px", lineHeight: 1.4 }}>
                📌 Catch-up plan: {goal.catchUpPlan}
              </div>
            )}
          </div>
        );
      })}

      {profile.goals.filter((g) => !g.archived).length > 1 && (
        <button onClick={() => setShowAllGoals(!showAllGoals)}
          style={{ width: "100%", textAlign: "center", background: "none", border: "none", color: COLORS.periwinkle, fontSize: 12.5, fontWeight: 600, cursor: "pointer", padding: "4px 0 14px" }}>
          {showAllGoals ? "Show less ▲" : `View all ${profile.goals.filter((g) => !g.archived).length} goals ▼`}
        </button>
      )}

      {pendingWaits.length > 0 && (
        <div style={{ ...cardStyle, marginTop: 14 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 10 }}>
            <span>{ICON.clock}</span>
            <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>On wait</span>
          </div>
          {pendingWaits.map((p) => (
            <OnWaitRow key={p.id} purchase={p} onResolveWait={onResolveWait} />
          ))}
        </div>
      )}

      {/* Spending log */}
      <div style={{ marginTop: 20, marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>Spending log</span>
        <button onClick={onLogSpending} style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.periwinkle, background: "none", border: "none", cursor: "pointer" }}>+ Log spending</button>
      </div>
      <button onClick={onReviewMonth} style={{ ...cardStyle, width: "100%", textAlign: "left", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
        <div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 500 }}>Logged this month</div>
          <div className="tmooi-mono" style={{ fontSize: 18, fontWeight: 600, color: COLORS.ink }}>${thisMonthSpend.toFixed(0)}</div>
        </div>
        <div style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.periwinkle }}>
          {!isPremium && (monthlyReviewsUsed || 0) >= 1 ? "Upgrade to review" : "Review my month"} {ICON.arrowRight}
        </div>
      </button>

      {/* Collaborations */}
      <div style={{ marginBottom: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.inkSoft, textTransform: "uppercase", letterSpacing: 0.4 }}>Collaborations</span>
        <button onClick={onNewGroupGoal} style={{ fontSize: 12.5, fontWeight: 600, color: COLORS.periwinkle, background: "none", border: "none", cursor: "pointer" }}>+ New</button>
      </div>
      {groupGoals.length === 0 && (
        <button onClick={onNewGroupGoal} style={{ ...cardStyle, width: "100%", boxSizing: "border-box", display: "block", textAlign: "left", cursor: "pointer", color: COLORS.inkSoft, fontSize: 13.5 }}>
          👯 Start a shared goal with friends or family
        </button>
      )}
      {(() => {
        const activeGroups = groupGoals.filter((g) => !g.archived);
        // Anything ready to celebrate always shows; otherwise lead with the one closest to done.
        const sorted = [...activeGroups].sort((a, b) => {
          const aMet = a.currentAmount >= a.targetAmount && !a.celebrated;
          const bMet = b.currentAmount >= b.targetAmount && !b.celebrated;
          if (aMet !== bMet) return aMet ? -1 : 1;
          return (b.currentAmount / b.targetAmount || 0) - (a.currentAmount / a.targetAmount || 0);
        });
        return showAllGroups ? sorted : sorted.slice(0, 1);
      })().map((g) => {
        const gp = Math.min(100, Math.round((g.currentAmount / g.targetAmount) * 100));
        const isMet = g.currentAmount >= g.targetAmount;
        const needsCelebration = isMet && !g.celebrated;

        if (needsCelebration) {
          return (
            <button key={g.id} onClick={() => onOpenGroupGoalCelebration(g.id)} className="tmooi-shine"
              style={{
                width: "100%", boxSizing: "border-box", textAlign: "left", cursor: "pointer", marginBottom: 10, display: "block",
                borderRadius: 18, padding: "18px", border: "none", background: COLORS.goldGrad,
                boxShadow: "0 12px 30px -10px rgba(205,168,85,0.6)", position: "relative", overflow: "hidden",
              }}>
              {["🎉", "✨", "🎊"].map((e, i) => (
                <span key={i} style={{ position: "absolute", left: `${20 + i * 30}%`, top: -14, fontSize: 16, animation: `confettiFall ${1.8 + i * 0.3}s ease-in ${i * 0.15}s infinite` }}>{e}</span>
              ))}
              <div style={{ fontSize: 11, fontWeight: 700, color: "rgba(33,23,5,0.7)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 4 }}>Goal met 🎉</div>
              <div className="tmooi-display" style={{ fontSize: 19, fontWeight: 700, color: COLORS.onGold, marginBottom: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Congratulations — {g.name}!</div>
              <div style={{ fontSize: 12.5, color: "rgba(33,23,5,0.75)" }}>${g.currentAmount} saved by {g.participants.length} people · tap to celebrate</div>
            </button>
          );
        }

        return (
          <button key={g.id} onClick={() => onOpenGroupGoal(g.id)} style={{ ...cardStyle, width: "100%", boxSizing: "border-box", textAlign: "left", cursor: "pointer", marginBottom: 10, display: "block" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, marginBottom: 8 }}>
              <span style={{ fontSize: 14, fontWeight: 600, color: COLORS.ink, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{GROUP_TYPES.find(t => t.id === g.type)?.emoji} {g.name}</span>
              <span className="tmooi-mono" style={{ fontSize: 12, color: COLORS.inkSoft, flexShrink: 0 }}>{gp}%</span>
            </div>
            <div style={{ height: 7, borderRadius: 8, background: COLORS.line, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${gp}%`, background: COLORS.honey, borderRadius: 8 }} />
            </div>
            <div className="tmooi-mono" style={{ fontSize: 11.5, color: COLORS.inkSoft, marginTop: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>${g.currentAmount} / ${g.targetAmount} · {g.participants.length} people</div>
          </button>
        );
      })}

      {groupGoals.filter((g) => !g.archived).length > 1 && (
        <button onClick={() => setShowAllGroups(!showAllGroups)}
          style={{ width: "100%", textAlign: "center", background: "none", border: "none", color: COLORS.periwinkle, fontSize: 12.5, fontWeight: 600, cursor: "pointer", padding: "4px 0 14px" }}>
          {showAllGroups ? "Show less ▲" : `View all ${groupGoals.filter((g) => !g.archived).length} collaborations ▼`}
        </button>
      )}

    </Shell>
  );
}

/* ---------------------------------------------------------------
   NEW PURCHASE FLOW
----------------------------------------------------------------*/
function NewPurchaseFlow({ profile, purchases, isPremium, phoneAFriendPostsUsed, onDone, onPhoneAFriend, onCancel }) {
  const activeGoals = profile.goals.filter((g) => !g.archived);
  const [stage, setStage] = useState(activeGoals.length > 1 ? "goal" : "item");
  const [selectedGoalId, setSelectedGoalId] = useState(activeGoals.length === 1 ? activeGoals[0].id : null);
  const [itemName, setItemName] = useState("");
  const [price, setPrice] = useState("");
  const [category, setCategory] = useState("");
  const [wantScore, setWantScore] = useState(6);
  const [needOrWant, setNeedOrWant] = useState(null);
  const [ownsSimilar, setOwnsSimilar] = useState(null);
  const [usage, setUsage] = useState(null);
  const [fullPrice, setFullPrice] = useState(null);
  const [trigger, setTrigger] = useState(null);
  const [decision, setDecision] = useState(null);
  const [companionMessage, setCompanionMessage] = useState("");
  const [finalPurchase, setFinalPurchase] = useState(null);
  const [relevantPattern, setRelevantPattern] = useState(null);
  const [qStep, setQStep] = useState(0);

  const questions = ["want", "need", "owns", "usage", "fullprice", "trigger"];
  const selectedGoal = profile.goals.find((g) => g.id === selectedGoalId) || null;

  useEffect(() => {
    if (stage === "loading") {
      const purchase = { itemName, price: parseFloat(price) || 0, category, wantScore, needOrWant, ownsSimilar, usage, fullPrice, trigger };
      setFinalPurchase(purchase);
      const d = runDecisionEngine(purchase, profile.spendingProfile, selectedGoal, getRegretSignal(purchases || []));
      setDecision(d);
      // Only surface the habit pattern when it's actually relevant to *this* purchase's trigger.
      const patterns = getRecentPatterns(purchases || []);
      setRelevantPattern(patterns && patterns.isImpulsePattern && patterns.topTrigger === trigger ? patterns : null);
      const sys = buildSystemPrompt(profile.companion, d, purchase, selectedGoal, profile);
      callCompanion(sys, `The purchase is ${itemName} for $${price}. What do you say?`).then((msg) => {
        setCompanionMessage(msg);
        setStage("result");
      });
    }
  }, [stage]);

  if (stage === "goal") {
    return (
      <Shell>
        <FlowHeader title="Which goal is this against?" onCancel={onCancel} />
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {profile.goals.filter((g) => !g.archived).map((g) => (
            <button key={g.id} onClick={() => { setSelectedGoalId(g.id); setStage("item"); }}
              style={{ padding: "14px 16px", borderRadius: 12, border: `1.5px solid ${COLORS.line}`, background: COLORS.glass, textAlign: "left", cursor: "pointer", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 14.5, fontWeight: 600, color: COLORS.ink }}>{GOAL_CATEGORIES.find(c => c.id === g.category)?.emoji} {g.name}</span>
              <span className="tmooi-mono" style={{ fontSize: 12.5, color: COLORS.inkSoft }}>${g.currentAmount}/${g.targetAmount}</span>
            </button>
          ))}
          <button onClick={() => { setSelectedGoalId(null); setStage("item"); }}
            style={{ padding: "14px 16px", borderRadius: 12, border: `1.5px dashed ${COLORS.line}`, background: "none", textAlign: "left", color: COLORS.inkSoft, fontSize: 14, cursor: "pointer" }}>
            Not tied to a specific goal
          </button>
        </div>
      </Shell>
    );
  }

  if (stage === "item") {
    return (
      <Shell>
        <FlowHeader title="What are you thinking about?" onCancel={onCancel} />
        <input value={itemName} onChange={(e) => setItemName(e.target.value)} placeholder="Item name" style={inputStyle} />
        <input value={price} onChange={(e) => setPrice(e.target.value.replace(/[^0-9.]/g, ""))} placeholder="Price ($)" inputMode="decimal" style={{ ...inputStyle, marginTop: 10 }} />
        <input value={category} onChange={(e) => setCategory(e.target.value)} placeholder="Category (e.g. Clothing)" style={{ ...inputStyle, marginTop: 10 }} />
        <div style={{ marginTop: 22 }}>
          <PrimaryButton onClick={() => setStage("questions")} disabled={!itemName.trim() || !price}>Continue {ICON.arrowRight}</PrimaryButton>
        </div>
      </Shell>
    );
  }

  if (stage === "questions") {
    const q = questions[qStep];
    const advance = () => (qStep < questions.length - 1 ? setQStep(qStep + 1) : setStage("loading"));
    const goBack = () => (qStep > 0 ? setQStep(qStep - 1) : setStage("item"));
    return (
      <Shell>
        <FlowHeader title={`${itemName} — $${price}`} onCancel={onCancel} />
        <ProgressDots step={qStep} total={questions.length} />
        <button onClick={goBack} style={{ background: "none", border: "none", color: COLORS.inkSoft, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: "4px 0 14px", display: "flex", alignItems: "center", gap: 4 }}>
          {ICON.arrowLeft} Back
        </button>

        {q === "want" && (
          <div>
            <h3 style={qTitle}>How badly do you want it? <span className="tmooi-mono" style={{ color: COLORS.periwinkle, fontWeight: 700 }}>{wantScore}/10</span></h3>
            <input type="range" min="1" max="10" value={wantScore} onChange={(e) => setWantScore(parseInt(e.target.value))}
              className="tmooi-range"
              style={{ background: `linear-gradient(to right, ${COLORS.periwinkle} 0%, ${COLORS.periwinkle} ${((wantScore - 1) / 9) * 100}%, ${COLORS.line} ${((wantScore - 1) / 9) * 100}%, ${COLORS.line} 100%)` }} />
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 11.5, color: COLORS.inkSoft }}>
              <span>Meh, whatever</span>
              <span>Can't stop thinking about it</span>
            </div>
            <div style={{ marginTop: 20 }}><PrimaryButton onClick={advance}>Continue {ICON.arrowRight}</PrimaryButton></div>
          </div>
        )}
        {q === "need" && (
          <ChoiceQ title="Is it a need or a want?" options={[{ id: "need", label: "Need" }, { id: "want", label: "Want" }, { id: "not_sure", label: "Not sure" }]} onSelect={(v) => { setNeedOrWant(v); advance(); }} />
        )}
        {q === "owns" && (
          <QuickQuestion title="One more thing." question="Do you already own something similar to this?" onAnswer={(v) => { setOwnsSimilar(v); advance(); }} />
        )}
        {q === "usage" && (
          <ChoiceQ title="Realistically, how often will you use this?" options={USAGE.map((u) => ({ id: u.id, label: u.label }))} onSelect={(v) => { setUsage(v); advance(); }} />
        )}
        {q === "fullprice" && (
          <ChoiceQ title="Would you buy it at full price?" options={[{ id: "yes", label: "Yes" }, { id: "no", label: "No" }, { id: "maybe", label: "Maybe" }]} onSelect={(v) => { setFullPrice(v); advance(); }} />
        )}
        {q === "trigger" && (
          <ChoiceQ title="What's influencing you?" options={TRIGGERS} onSelect={(v) => { setTrigger(v); advance(); }} />
        )}
      </Shell>
    );
  }

  if (stage === "loading") {
    return (
      <Shell>
        <div style={{ textAlign: "center", paddingTop: 100 }}>
          <div style={{ fontSize: 32, marginBottom: 14 }}>💭</div>
          <div style={{ color: COLORS.inkSoft, fontSize: 14 }}>Your companion is thinking it over...</div>
        </div>
      </Shell>
    );
  }

  if (stage === "result") {
    return (
      <ResultScreen
        profile={profile}
        goal={selectedGoal}
        purchase={finalPurchase}
        decision={decision}
        companionMessage={companionMessage}
        pattern={relevantPattern}
        onDone={onDone}
        onPhoneAFriend={onPhoneAFriend}
        isPremium={isPremium}
        phoneAFriendPostsUsed={phoneAFriendPostsUsed}
      />
    );
  }

  return null;
}

function FlowHeader({ title, onCancel }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
      <h2 className="tmooi-display" style={{ fontSize: 20, fontWeight: 600, color: COLORS.ink }}>{title}</h2>
      <button onClick={onCancel} style={{ background: COLORS.goldGrad, border: "none", borderRadius: 8, width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: COLORS.onGold, fontWeight: 700, boxShadow: "0 4px 12px -4px rgba(0,0,0,0.3)" }}>
        {ICON.x}
      </button>
    </div>
  );
}

function ChoiceQ({ title, options, onSelect }) {
  return (
    <div>
      <h3 style={qTitle}>{title}</h3>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {options.map((o) => (
          <button key={o.id} onClick={() => onSelect(o.id)} style={{ padding: "14px 16px", borderRadius: 12, border: `1.5px solid ${COLORS.line}`, background: COLORS.glass, textAlign: "left", fontSize: 14.5, fontWeight: 500, color: COLORS.ink, cursor: "pointer" }}>
            {o.label}
          </button>
        ))}
      </div>
    </div>
